<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="400" rx="12" fill="#faf9f5"/>

  <!-- Header -->
  <text x="400" y="38" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">Claude Code vs Copilot vs Cursor</text>
  <text x="400" y="60" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#b0aea5">全方位对比</text>

  <!-- Column headers -->
  <rect x="48" y="78" width="704" height="36" rx="6" fill="#141413"/>
  <text x="155" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="700" fill="#faf9f5">对比维度</text>
  <text x="315" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="700" fill="#faf9f5">GitHub Copilot</text>
  <text x="480" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="700" fill="#faf9f5">Cursor</text>
  <text x="670" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="700" fill="#faf9f5">Claude Code</text>

  <!-- Column dividers in header -->
  <rect x="238" y="78" width="1" height="36" fill="#444"/>
  <rect x="398" y="78" width="1" height="36" fill="#444"/>
  <rect x="570" y="78" width="1" height="36" fill="#444"/>

  <!-- Row 1: 交互方式 -->
  <rect x="48" y="114" width="704" height="32" rx="0" fill="#faf9f5"/>
  <rect x="238" y="114" width="1" height="32" fill="#e8e6dc"/>
  <rect x="398" y="114" width="1" height="32" fill="#e8e6dc"/>
  <rect x="570" y="114" width="1" height="32" fill="#e8e6dc"/>
  <text x="155" y="134" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">交互方式</text>
  <text x="315" y="134" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">编辑器内联补全</text>
  <text x="480" y="134" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">IDE + Chat</text>
  <text x="670" y="134" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">终端 CLI</text>

  <!-- Row 2: 上下文范围 -->
  <rect x="48" y="146" width="704" height="32" rx="0" fill="#faf9f5" opacity="0.6"/>
  <rect x="238" y="146" width="1" height="32" fill="#e8e6dc"/>
  <rect x="398" y="146" width="1" height="32" fill="#e8e6dc"/>
  <rect x="570" y="146" width="1" height="32" fill="#e8e6dc"/>
  <text x="155" y="166" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">上下文范围</text>
  <text x="315" y="166" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">当前文件</text>
  <text x="480" y="166" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">当前项目</text>
  <text x="670" y="166" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">✅ 整个仓库 + MCP</text>

  <!-- Row 3: 批量修改 -->
  <rect x="48" y="178" width="704" height="32" rx="0" fill="#faf9f5"/>
  <rect x="238" y="178" width="1" height="32" fill="#e8e6dc"/>
  <rect x="398" y="178" width="1" height="32" fill="#e8e6dc"/>
  <rect x="570" y="178" width="1" height="32" fill="#e8e6dc"/>
  <text x="155" y="198" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">批量修改</text>
  <text x="315" y="198" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">不支持</text>
  <text x="480" y="198" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">有限</text>
  <text x="670" y="198" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">✅ 原生支持</text>

  <!-- Row 4: 运行命令 -->
  <rect x="48" y="210" width="704" height="32" rx="0" fill="#faf9f5" opacity="0.6"/>
  <rect x="238" y="210" width="1" height="32" fill="#e8e6dc"/>
  <rect x="398" y="210" width="1" height="32" fill="#e8e6dc"/>
  <rect x="570" y="210" width="1" height="32" fill="#e8e6dc"/>
  <text x="155" y="230" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">运行命令</text>
  <text x="315" y="230" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">不支持</text>
  <text x="480" y="230" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">有限</text>
  <text x="670" y="230" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">✅ 可执行 shell</text>

  <!-- Row 5: 插件系统 -->
  <rect x="48" y="242" width="704" height="32" rx="0" fill="#faf9f5"/>
  <rect x="238" y="242" width="1" height="32" fill="#e8e6dc"/>
  <rect x="398" y="242" width="1" height="32" fill="#e8e6dc"/>
  <rect x="570" y="242" width="1" height="32" fill="#e8e6dc"/>
  <text x="155" y="262" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">插件系统</text>
  <text x="315" y="262" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">无</text>
  <text x="480" y="262" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">无</text>
  <text x="670" y="262" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">✅ Skills + MCP</text>

  <!-- Row 6: 适用场景 -->
  <rect x="48" y="274" width="704" height="36" rx="0" fill="#faf9f5" opacity="0.6"/>
  <rect x="238" y="274" width="1" height="36" fill="#e8e6dc"/>
  <rect x="398" y="274" width="1" height="36" fill="#e8e6dc"/>
  <rect x="570" y="274" width="1" height="36" fill="#e8e6dc"/>
  <text x="155" y="296" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">适用场景</text>
  <text x="315" y="296" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">写新代码</text>
  <text x="480" y="296" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">交互式编程</text>
  <text x="670" y="296" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">复杂重构+调试+自动化</text>

  <!-- Accent column highlight for Claude Code -->
  <rect x="570" y="114" width="182" height="196" rx="0" fill="#d97757" opacity="0.04"/>

  <!-- Verdict bar -->
  <rect x="48" y="330" width="704" height="30" rx="6" fill="#d97757" opacity="0.1"/>
  <circle cx="80" cy="345" r="5" fill="#d97757"/>
  <text x="94" y="350" font-family="Lora,Georgia,serif" font-size="13" fill="#d97757" font-weight="600">如果你的工作涉及复杂重构、批量修改、跨文件理解 —— Claude Code 是更好的选择</text>

  <!-- Bottom annotation -->
  <rect x="48" y="372" width="704" height="20" rx="0" fill="transparent"/>
  <text x="400" y="386" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="#b0aea5">三者可以互补：编辑时用 Copilot 补全，Cursor 做交互式探索，Claude Code 做深度任务</text>
</svg>
