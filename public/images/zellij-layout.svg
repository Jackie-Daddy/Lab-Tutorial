<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" fill="none">
  <defs>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="440" rx="12" fill="#faf9f5"/>

  <text x="400" y="38" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">推荐的 Zellij 开发布局</text>
  <text x="400" y="60" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#b0aea5">左文件浏览 + 右上下分屏（终端 + Claude Code）</text>

  <!-- Chrome/title bar -->
  <rect x="60" y="82" width="680" height="28" rx="5" fill="#141413"/>
  <circle cx="80" cy="96" r="5" fill="#d97757"/>
  <circle cx="96" cy="96" r="5" fill="#6a9bcc" opacity="0.6"/>
  <circle cx="112" cy="96" r="5" fill="#788c5d" opacity="0.7"/>
  <text x="160" y="100" font-family="Lora,Georgia,serif" font-size="11" fill="#faf9f5">Tab 1 · Dev</text>
  <rect x="580" y="88" width="74" height="16" rx="8" fill="#d97757" opacity="0.25"/>
  <text x="617" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#faf9f5">Ctrl+O 1</text>
  <rect x="660" y="88" width="66" height="16" rx="8" fill="rgba(250,249,245,0.12)"/>
  <text x="693" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#b0aea5">Tab 2</text>

  <!-- Layout area -->
  <rect x="60" y="110" width="680" height="270" rx="0" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>

  <!-- Left pane: Yazi -->
  <rect x="60" y="110" width="250" height="270" rx="0" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5"/>
  <!-- Pane header -->
  <rect x="61" y="111" width="248" height="22" fill="#6a9bcc" opacity="0.12"/>
  <text x="74" y="126" font-family="monospace" font-size="10" fill="#6a9bcc" font-weight="600">Yazi · 文件浏览器</text>
  <!-- File mock -->
  <text x="78" y="152" font-family="monospace" font-size="10" fill="#141413">📂 src/</text>
  <text x="94" y="170" font-family="monospace" font-size="10" fill="#788c5d">📄 utils.py</text>
  <text x="94" y="186" font-family="monospace" font-size="10" fill="#788c5d">📄 model.py</text>
  <text x="94" y="202" font-family="monospace" font-size="10" fill="#141413">📄 train.py</text>
  <text x="94" y="218" font-family="monospace" font-size="10" fill="#141413">📄 config.yaml</text>
  <text x="78" y="244" font-family="monospace" font-size="10" fill="#141413">📂 tests/</text>
  <text x="78" y="270" font-family="monospace" font-size="10" fill="#141413">📂 data/</text>
  <text x="78" y="296" font-family="monospace" font-size="10" fill="#b0aea5">📄 README.md</text>

  <!-- Vertical divider -->
  <line x1="310" y1="110" x2="310" y2="380" stroke="#e8e6dc" stroke-width="1.5"/>

  <!-- Right top: Terminal -->
  <rect x="310" y="110" width="430" height="135" fill="#141413"/>
  <rect x="311" y="111" width="428" height="22" fill="#141413"/>
  <text x="324" y="126" font-family="monospace" font-size="10" fill="#788c5d">终端 · 命令执行</text>

  <!-- Terminal content -->
  <text x="322" y="152" font-family="monospace" font-size="10" fill="#6a9bcc">$</text>
  <text x="334" y="152" font-family="monospace" font-size="10" fill="#faf9f5">python train.py --epochs 100</text>
  <text x="322" y="172" font-family="monospace" font-size="10" fill="#b0aea5">Epoch 1/100: loss=0.432, acc=0.78</text>
  <text x="322" y="188" font-family="monospace" font-size="10" fill="#b0aea5">Epoch 2/100: loss=0.318, acc=0.83</text>
  <text x="322" y="204" font-family="monospace" font-size="10" fill="#b0aea5">Epoch 3/100: loss=0.251, acc=0.87</text>
  <text x="322" y="224" font-family="monospace" font-size="10" fill="#6a9bcc">▊</text>
  <text x="334" y="224" font-family="monospace" font-size="10" fill="#faf9f5" opacity="0.5">training in progress...</text>

  <!-- Horizontal divider -->
  <line x1="310" y1="245" x2="740" y2="245" stroke="#e8e6dc" stroke-width="1.5"/>

  <!-- Right bottom: Claude Code -->
  <rect x="310" y="245" width="430" height="135" fill="#faf9f5"/>
  <rect x="311" y="246" width="428" height="22" fill="#141413" opacity="0.06"/>
  <text x="324" y="261" font-family="monospace" font-size="10" fill="#d97757" font-weight="600">Claude Code · AI 助手</text>

  <!-- Claude content -->
  <rect x="322" y="274" width="406" height="16" rx="3" fill="#e8e6dc"/>
  <text x="330" y="286" font-family="Lora,Georgia,serif" font-size="10" fill="#141413">帮我看一下 model.py 里的 forward 函数有什么问题</text>
  <rect x="322" y="298" width="406" height="48" rx="3" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="330" y="314" font-family="Lora,Georgia,serif" font-size="10" fill="#141413">看了你的 forward 函数，有两处可以改进：</text>
  <text x="330" y="330" font-family="Lora,Georgia,serif" font-size="10" fill="#141413">1. L314 的 reshape 操作在 batch_size=1 时会出错</text>
  <text x="330" y="346" font-family="Lora,Georgia,serif" font-size="10" fill="#141413">2. attention mask 没有传给 encoder，建议加 mask 参数</text>

  <!-- Bottom annotation -->
  <rect x="60" y="396" width="680" height="32" rx="6" fill="#141413" opacity="0.04"/>
  <text x="400" y="417" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#141413">
    左边
    <tspan fill="#6a9bcc" font-weight="600">Yazi</tspan>
    浏览项目 → 右边
    <tspan fill="#788c5d" font-weight="600">终端</tspan>
    跑命令 → 右边
    <tspan fill="#d97757" font-weight="600">Claude Code</tspan>
    辅助编程
  </text>
</svg>
