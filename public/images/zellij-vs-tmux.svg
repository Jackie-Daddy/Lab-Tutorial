<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" fill="none">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="340" rx="12" fill="#faf9f5"/>

  <!-- Header -->
  <text x="400" y="38" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">Zellij vs tmux</text>
  <text x="400" y="60" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#b0aea5">为什么选择 Zellij？全方位对比</text>

  <!-- Column headers -->
  <rect x="48" y="78" width="704" height="36" rx="6" fill="#141413"/>
  <text x="170" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="700" fill="#faf9f5">对比维度</text>
  <text x="400" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="700" fill="#faf9f5">tmux</text>
  <text x="630" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="700" fill="#faf9f5">Zellij</text>

  <!-- Row 1: Default -->
  <rect x="48" y="118" width="704" height="28" rx="0" fill="#faf9f5"/>
  <rect x="225" y="118" width="1" height="28" fill="#e8e6dc"/>
  <rect x="470" y="118" width="1" height="28" fill="#e8e6dc"/>
  <text x="170" y="136" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">默认配置</text>
  <text x="400" y="136" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">需要大量自定义才能好用</text>
  <text x="630" y="136" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">✅ 开箱即用，底部快捷键提示</text>

  <!-- Row 2 -->
  <rect x="48" y="146" width="704" height="28" rx="0" fill="#faf9f5" opacity="0.6"/>
  <rect x="225" y="146" width="1" height="28" fill="#e8e6dc"/>
  <rect x="470" y="146" width="1" height="28" fill="#e8e6dc"/>
  <text x="170" y="164" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">浮动窗格</text>
  <text x="400" y="164" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">不支持</text>
  <text x="630" y="164" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">✅ 原生浮动/嵌入窗格</text>

  <!-- Row 3 -->
  <rect x="48" y="174" width="704" height="28" rx="0" fill="#faf9f5"/>
  <rect x="225" y="174" width="1" height="28" fill="#e8e6dc"/>
  <rect x="470" y="174" width="1" height="28" fill="#e8e6dc"/>
  <text x="170" y="192" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">布局系统</text>
  <text x="400" y="192" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">手动管理，无模板</text>
  <text x="630" y="192" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">✅ KDL 格式布局模板</text>

  <!-- Row 4 -->
  <rect x="48" y="202" width="704" height="28" rx="0" fill="#faf9f5" opacity="0.6"/>
  <rect x="225" y="202" width="1" height="28" fill="#e8e6dc"/>
  <rect x="470" y="202" width="1" height="28" fill="#e8e6dc"/>
  <text x="170" y="220" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">插件系统</text>
  <text x="400" y="220" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">第三方脚本</text>
  <text x="630" y="220" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">✅ 原生 WASM 插件</text>

  <!-- Row 5 -->
  <rect x="48" y="230" width="704" height="28" rx="0" fill="#faf9f5"/>
  <rect x="225" y="230" width="1" height="28" fill="#e8e6dc"/>
  <rect x="470" y="230" width="1" height="28" fill="#e8e6dc"/>
  <text x="170" y="248" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">协作编辑</text>
  <text x="400" y="248" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">不内置</text>
  <text x="630" y="248" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">✅ 多用户会话共享</text>

  <!-- Row 6 -->
  <rect x="48" y="258" width="704" height="28" rx="0" fill="#faf9f5" opacity="0.6"/>
  <rect x="225" y="258" width="1" height="28" fill="#e8e6dc"/>
  <rect x="470" y="258" width="1" height="28" fill="#e8e6dc"/>
  <text x="170" y="276" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">配置语言</text>
  <text x="400" y="276" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">tmux.conf</text>
  <text x="630" y="276" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">✅ KDL（可读性更好）</text>

  <!-- Verdict bar -->
  <rect x="48" y="300" width="704" height="30" rx="6" fill="#d97757" opacity="0.1"/>
  <circle cx="80" cy="315" r="5" fill="#d97757"/>
  <text x="94" y="320" font-family="Lora,Georgia,serif" font-size="13" fill="#d97757" font-weight="600">如果你从零开始选终端多路复用器，Zellij 是更好的默认选择</text>
</svg>
