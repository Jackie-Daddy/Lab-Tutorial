<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" fill="none">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="260" rx="12" fill="#faf9f5"/>

  <text x="400" y="34" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">推荐 ~/.tmux.conf 配置</text>
  <text x="400" y="54" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">三行配置解决三个痛点</text>

  <!-- Config file background -->
  <rect x="50" y="74" width="700" height="168" rx="10" fill="#141413" filter="url(#sh)"/>

  <!-- Fake title bar -->
  <rect x="50" y="74" width="700" height="28" rx="10" fill="#2a2a2a"/>
  <rect x="50" y="86" width="700" height="16" fill="#2a2a2a"/>
  <circle cx="70" cy="88" r="5" fill="#d97757"/>
  <circle cx="86" cy="88" r="5" fill="#b0aea5"/>
  <circle cx="102" cy="88" r="5" fill="#788c5d"/>
  <text x="400" y="93" text-anchor="middle" font-family="monospace" font-size="10" fill="#b0aea5">~/.tmux.conf</text>

  <!-- Line 1: mouse on -->
  <text x="74" y="120" font-family="monospace" font-size="13" fill="#b0aea5">1</text>
  <text x="100" y="120" font-family="monospace" font-size="13" fill="#6a9bcc">set -g mouse on</text>
  <text x="340" y="120" font-family="monospace" font-size="11" fill="#5a5955"># 启用鼠标：可滚轮翻页、可点选窗格</text>

  <!-- Mouse icon for line 1 -->
  <g transform="translate(620, 108)" fill="none" stroke="#788c5d" stroke-width="1.5">
    <rect x="2" y="2" width="14" height="22" rx="7"/>
    <line x1="9" y1="5" x2="9" y2="12"/>
    <line x1="9" y1="8" x2="4" y2="8"/>
    <line x1="9" y1="8" x2="14" y2="8"/>
    <line x1="9" y1="18" x2="9" y2="26"/>
  </g>

  <!-- Line 2: mode-keys vi -->
  <text x="74" y="148" font-family="monospace" font-size="13" fill="#b0aea5">2</text>
  <text x="100" y="148" font-family="monospace" font-size="13" fill="#6a9bcc">setw -g mode-keys vi</text>
  <text x="340" y="148" font-family="monospace" font-size="11" fill="#5a5955"># 复制模式使用 vi 键位</text>

  <!-- Keyboard icon for line 2 -->
  <g transform="translate(622, 133)" fill="none" stroke="#6a9bcc" stroke-width="1.5">
    <rect x="0" y="0" width="28" height="16" rx="2"/>
    <rect x="4" y="3" width="4" height="3" rx="0.5"/>
    <rect x="10" y="3" width="4" height="3" rx="0.5"/>
    <rect x="16" y="3" width="4" height="3" rx="0.5"/>
    <rect x="22" y="3" width="2" height="3" rx="0.5"/>
    <rect x="6" y="9" width="3" height="3" rx="0.5"/>
    <rect x="11" y="9" width="3" height="3" rx="0.5"/>
    <rect x="16" y="9" width="3" height="3" rx="0.5"/>
    <rect x="21" y="9" width="3" height="3" rx="0.5"/>
    <rect x="26" y="9" width="2" height="3" rx="0.5"/>
  </g>
  <text x="660" y="146" font-family="monospace" font-size="8" fill="#6a9bcc">vi</text>

  <!-- Line 3: history-limit -->
  <text x="74" y="176" font-family="monospace" font-size="13" fill="#b0aea5">3</text>
  <text x="100" y="176" font-family="monospace" font-size="13" fill="#6a9bcc">set -g history-limit 10000</text>
  <text x="340" y="176" font-family="monospace" font-size="11" fill="#5a5955"># 增大历史滚动行数（默认只有 2000）</text>

  <!-- Scroll icon for line 3 -->
  <g transform="translate(625, 160)" fill="none" stroke="#d97757" stroke-width="1.5">
    <rect x="0" y="0" width="18" height="20" rx="3"/>
    <line x1="9" y1="5" x2="9" y2="14"/>
    <polyline points="5,10 9,14 13,10"/>
  </g>

  <!-- Line 4 (cursor) -->
  <line x1="100" y1="206" x2="300" y2="206" stroke="#faf9f5" stroke-width="1.5" opacity="0.5"/>
  <rect x="100" y="204" width="6" height="10" rx="3" fill="#faf9f5" opacity="0.6"/>

  <!-- Bottom tip -->
  <text x="400" y="258" text-anchor="middle" font-family="monospace" font-size="10" fill="#b0aea5">保存后执行 tmux source-file ~/.tmux.conf 立即生效</text>
</svg>
