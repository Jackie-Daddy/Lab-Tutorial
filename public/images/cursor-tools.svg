<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#141413" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="300" rx="12" fill="#faf9f5"/>

  <!-- Title -->
  <text x="340" y="42" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="bold" fill="#141413">适用工具 &amp; 配置方式</text>
  <line x1="230" y1="52" x2="450" y2="52" stroke="#d97757" stroke-width="2"/>

  <!-- ===== CARD 1: Cursor ===== -->
  <rect x="20" y="70" width="205" height="140" rx="10" fill="#e8e6dc" filter="url(#sh)"/>
  <rect x="20" y="70" width="205" height="38" rx="10" fill="#6a9bcc"/>
  <rect x="20" y="98" width="205" height="10" fill="#6a9bcc"/>

  <!-- Cursor cube icon -->
  <rect x="44" y="79" width="14" height="14" rx="3" fill="#fff" fill-opacity="0.4"/>
  <text x="51" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#fff">C</text>

  <text x="84" y="93" font-family="Lora,Georgia,serif" font-size="14" font-weight="bold" fill="#fff">Cursor</text>

  <!-- Setup steps -->
  <circle cx="40" cy="122" r="6" fill="#b0aea5"/>
  <text x="40" y="125" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#fff">1</text>
  <text x="54" y="126" font-family="monospace" font-size="10" fill="#141413">Settings</text>

  <line x1="54" y1="132" x2="150" y2="132" stroke="#b0aea5" stroke-width="0.5"/>

  <circle cx="40" cy="144" r="6" fill="#b0aea5"/>
  <text x="40" y="147" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#fff">2</text>
  <text x="54" y="148" font-family="monospace" font-size="10" fill="#141413">Rules for AI</text>

  <line x1="54" y1="154" x2="150" y2="154" stroke="#b0aea5" stroke-width="0.5"/>

  <circle cx="40" cy="166" r="6" fill="#b0aea5"/>
  <text x="40" y="169" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#fff">3</text>
  <text x="54" y="170" font-family="monospace" font-size="10" fill="#141413">粘贴提示词</text>

  <!-- Tooltip -->
  <rect x="30" y="188" width="185" height="16" rx="3" fill="#6a9bcc" fill-opacity="0.1"/>
  <text x="122" y="200" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a9bcc">支持 Global &amp; Project Rules</text>

  <!-- ===== CARD 2: Windsurf ===== -->
  <rect x="237" y="70" width="205" height="140" rx="10" fill="#e8e6dc" filter="url(#sh)"/>
  <rect x="237" y="70" width="205" height="38" rx="10" fill="#d97757"/>
  <rect x="237" y="98" width="205" height="10" fill="#d97757"/>

  <!-- Windsurf wave icon -->
  <text x="260" y="91" font-family="monospace" font-size="16" fill="#fff" fill-opacity="0.5">W</text>

  <text x="290" y="93" font-family="Lora,Georgia,serif" font-size="14" font-weight="bold" fill="#fff">Windsurf</text>

  <circle cx="257" cy="122" r="6" fill="#b0aea5"/>
  <text x="257" y="125" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#fff">1</text>
  <text x="271" y="126" font-family="monospace" font-size="10" fill="#141413">Settings</text>

  <line x1="271" y1="132" x2="367" y2="132" stroke="#b0aea5" stroke-width="0.5"/>

  <circle cx="257" cy="144" r="6" fill="#b0aea5"/>
  <text x="257" y="147" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#fff">2</text>
  <text x="271" y="148" font-family="monospace" font-size="10" fill="#141413">AI Rules</text>

  <line x1="271" y1="154" x2="367" y2="154" stroke="#b0aea5" stroke-width="0.5"/>

  <circle cx="257" cy="166" r="6" fill="#b0aea5"/>
  <text x="257" y="169" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#fff">3</text>
  <text x="271" y="170" font-family="monospace" font-size="10" fill="#141413">粘贴提示词</text>

  <rect x="247" y="188" width="185" height="16" rx="3" fill="#d97757" fill-opacity="0.1"/>
  <text x="339" y="200" text-anchor="middle" font-family="monospace" font-size="8" fill="#d97757">基于 VSCode，配置与 Cursor 通用</text>

  <!-- ===== CARD 3: Claude Code ===== -->
  <rect x="454" y="70" width="205" height="140" rx="10" fill="#e8e6dc" filter="url(#sh)"/>
  <rect x="454" y="70" width="205" height="38" rx="10" fill="#141413"/>
  <rect x="454" y="98" width="205" height="10" fill="#141413"/>

  <!-- Terminal icon -->
  <text x="478" y="91" font-family="monospace" font-size="14" fill="#788c5d">&gt;_</text>

  <text x="508" y="93" font-family="Lora,Georgia,serif" font-size="14" font-weight="bold" fill="#fff">Claude Code</text>

  <circle cx="474" cy="122" r="6" fill="#b0aea5"/>
  <text x="474" y="125" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#fff">1</text>
  <text x="488" y="126" font-family="monospace" font-size="10" fill="#141413">项目根目录</text>

  <line x1="488" y1="132" x2="570" y2="132" stroke="#b0aea5" stroke-width="0.5"/>

  <circle cx="474" cy="144" r="6" fill="#b0aea5"/>
  <text x="474" y="147" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#fff">2</text>
  <text x="488" y="148" font-family="monospace" font-size="10" fill="#141413">CLAUDE.md</text>

  <line x1="488" y1="154" x2="570" y2="154" stroke="#b0aea5" stroke-width="0.5"/>

  <circle cx="474" cy="166" r="6" fill="#b0aea5"/>
  <text x="474" y="169" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#fff">3</text>
  <text x="488" y="170" font-family="monospace" font-size="10" fill="#141413">粘贴提示词</text>

  <rect x="464" y="188" width="185" height="16" rx="3" fill="#141413" fill-opacity="0.05"/>
  <text x="556" y="200" text-anchor="middle" font-family="monospace" font-size="8" fill="#141413">终端原生，自动生效</text>

  <!-- ===== BOTTOM: Advanced customization ===== -->
  <rect x="20" y="226" width="640" height="58" rx="10" fill="#e8e6dc" filter="url(#sh)"/>
  <text x="340" y="250" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="bold" fill="#141413">进阶：按项目类型定制</text>
  <line x1="230" y1="256" x2="450" y2="256" stroke="#b0aea5" stroke-width="0.5"/>

  <!-- Three project type tags -->
  <rect x="80" y="262" width="150" height="18" rx="4" fill="#d97757" fill-opacity="0.15"/>
  <text x="155" y="275" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757">研究项目 — 激进</text>

  <rect x="250" y="262" width="150" height="18" rx="4" fill="#6a9bcc" fill-opacity="0.15"/>
  <text x="325" y="275" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a9bcc">生产系统 — 保守</text>

  <rect x="420" y="262" width="150" height="18" rx="4" fill="#788c5d" fill-opacity="0.15"/>
  <text x="495" y="275" text-anchor="middle" font-family="monospace" font-size="9" fill="#788c5d">教学项目 — 多解释</text>
</svg>
