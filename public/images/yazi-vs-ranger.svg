<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" fill="none">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="340" rx="12" fill="#faf9f5"/>

  <!-- Header -->
  <text x="400" y="38" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">Yazi vs ranger vs lf</text>
  <text x="400" y="60" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#b0aea5">为什么用 Rust 重写？异步 I/O 带来的速度飞跃</text>

  <!-- Column headers -->
  <rect x="48" y="78" width="704" height="36" rx="6" fill="#141413"/>
  <text x="155" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="700" fill="#faf9f5">对比维度</text>
  <text x="330" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="700" fill="#faf9f5">ranger</text>
  <text x="495" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="700" fill="#faf9f5">lf</text>
  <text x="660" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="700" fill="#faf9f5">Yazi</text>

  <!-- Header internal dividers -->
  <rect x="243" y="82" width="1" height="28" fill="rgba(250,249,245,0.15)"/>
  <rect x="413" y="82" width="1" height="28" fill="rgba(250,249,245,0.15)"/>
  <rect x="578" y="82" width="1" height="28" fill="rgba(250,249,245,0.15)"/>

  <!-- Row 1: Language -->
  <rect x="48" y="118" width="704" height="28" rx="0" fill="#faf9f5"/>
  <text x="155" y="136" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">开发语言</text>
  <text x="330" y="136" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">Python</text>
  <text x="495" y="136" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">Go</text>
  <text x="660" y="136" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">Rust</text>

  <!-- Row 2: Speed -->
  <rect x="48" y="146" width="704" height="28" rx="0" fill="#faf9f5" opacity="0.6"/>
  <text x="155" y="164" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">速度</text>
  <text x="330" y="164" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">慢（同步 I/O）</text>
  <text x="495" y="164" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">快</text>
  <text x="660" y="164" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">快 + 异步 I/O</text>

  <!-- Row 3: Image preview -->
  <rect x="48" y="174" width="704" height="28" rx="0" fill="#faf9f5"/>
  <text x="155" y="192" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">图片预览</text>
  <text x="330" y="192" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">外部脚本</text>
  <text x="495" y="192" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">外部脚本</text>
  <text x="660" y="192" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">内置支持</text>

  <!-- Row 4: Plugins -->
  <rect x="48" y="202" width="704" height="28" rx="0" fill="#faf9f5" opacity="0.6"/>
  <text x="155" y="220" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">插件系统</text>
  <text x="330" y="220" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">Python 脚本</text>
  <text x="495" y="220" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">无</text>
  <text x="660" y="220" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">Lua 插件</text>

  <!-- Row 5: Multi-tab -->
  <rect x="48" y="230" width="704" height="28" rx="0" fill="#faf9f5"/>
  <text x="155" y="248" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">多标签页</text>
  <text x="330" y="248" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">支持</text>
  <text x="495" y="248" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">不支持</text>
  <text x="660" y="248" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">原生支持</text>

  <!-- Row 6: Config -->
  <rect x="48" y="258" width="704" height="28" rx="0" fill="#faf9f5" opacity="0.6"/>
  <text x="155" y="276" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">配置复杂度</text>
  <text x="330" y="276" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">高</text>
  <text x="495" y="276" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">低</text>
  <text x="660" y="276" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413" font-weight="600">低</text>

  <!-- Column dividers -->
  <rect x="243" y="118" width="1" height="168" fill="#e8e6dc"/>
  <rect x="413" y="118" width="1" height="168" fill="#e8e6dc"/>
  <rect x="578" y="118" width="1" height="168" fill="#e8e6dc"/>

  <!-- Verdict bar -->
  <rect x="48" y="300" width="704" height="30" rx="6" fill="#d97757" opacity="0.1"/>
  <circle cx="80" cy="315" r="5" fill="#d97757"/>
  <text x="94" y="320" font-family="Lora,Georgia,serif" font-size="13" fill="#d97757" font-weight="600">如果你从 ranger 迁移到 Yazi，速度提升立竿见影</text>
</svg>
