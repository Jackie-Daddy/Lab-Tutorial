<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#141413" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b0aea5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="460" rx="12" fill="#faf9f5"/>

  <!-- Title -->
  <text x="380" y="42" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="bold" fill="#141413">五步配置远程调试</text>
  <line x1="300" y1="52" x2="460" y2="52" stroke="#d97757" stroke-width="2"/>

  <!-- ===== STEP 1 ===== -->
  <rect x="15" y="72" width="136" height="180" rx="10" fill="#e8e6dc" filter="url(#sh)"/>
  <circle cx="40" cy="92" r="14" fill="#d97757"/>
  <text x="40" y="97" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#fff">1</text>
  <text x="63" y="97" font-family="Lora,Georgia,serif" font-size="11" font-weight="bold" fill="#141413">安装 debugpy</text>

  <!-- Terminal -->
  <rect x="25" y="106" width="116" height="80" rx="5" fill="#141413"/>
  <rect x="25" y="106" width="116" height="16" rx="5" fill="#333333"/>
  <circle cx="35" cy="114" r="3" fill="#d97757"/>
  <circle cx="45" cy="114" r="3" fill="#b0aea5"/>
  <circle cx="55" cy="114" r="3" fill="#788c5d"/>
  <text x="33" y="140" font-family="monospace" font-size="9" fill="#6a9bcc">$</text>
  <text x="47" y="140" font-family="monospace" font-size="9" fill="#fff">pip install</text>
  <text x="47" y="155" font-family="monospace" font-size="9" fill="#fff">  debugpy</text>
  <text x="33" y="175" font-family="monospace" font-size="8" fill="#788c5d">Successfully</text>
  <text x="33" y="185" font-family="monospace" font-size="8" fill="#788c5d">installed</text>

  <text x="83" y="204" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">一行命令</text>
  <text x="83" y="218" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">服务器端安装</text>

  <!-- Arrow 1→2 -->
  <line x1="151" y1="162" x2="162" y2="162" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 2 ===== -->
  <rect x="166" y="72" width="136" height="180" rx="10" fill="#e8e6dc" filter="url(#sh)"/>
  <circle cx="191" cy="92" r="14" fill="#d97757"/>
  <text x="191" y="97" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#fff">2</text>
  <text x="214" y="97" font-family="Lora,Georgia,serif" font-size="11" font-weight="bold" fill="#141413">SSH 隧道</text>

  <!-- Config file visual -->
  <rect x="176" y="110" width="116" height="62" rx="5" fill="#141413"/>
  <text x="184" y="128" font-family="monospace" font-size="8" fill="#b0aea5">~/.ssh/config</text>
  <line x1="184" y1="132" x2="284" y2="132" stroke="#333" stroke-width="0.5"/>
  <text x="184" y="145" font-family="monospace" font-size="7" fill="#6a9bcc">Host</text>
  <text x="216" y="145" font-family="monospace" font-size="7" fill="#fff">myserver</text>
  <text x="188" y="157" font-family="monospace" font-size="7" fill="#b0aea5"> HostName</text>
  <text x="188" y="167" font-family="monospace" font-size="7" fill="#d97757">LocalForward</text>
  <text x="264" y="167" font-family="monospace" font-size="7" fill="#788c5d">5678</text>

  <text x="234" y="192" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">添加端口转发</text>
  <text x="234" y="206" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">localhost → server</text>
  <text x="234" y="220" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">:5678</text>

  <!-- Arrow 2→3 -->
  <line x1="302" y1="162" x2="313" y2="162" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 3 ===== -->
  <rect x="317" y="72" width="136" height="180" rx="10" fill="#e8e6dc" filter="url(#sh)"/>
  <circle cx="342" cy="92" r="14" fill="#d97757"/>
  <text x="342" y="97" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#fff">3</text>
  <text x="365" y="97" font-family="Lora,Georgia,serif" font-size="11" font-weight="bold" fill="#141413">启动调试服务</text>

  <rect x="327" y="108" width="116" height="72" rx="5" fill="#141413"/>
  <text x="335" y="124" font-family="monospace" font-size="7" fill="#b0aea5">$</text>
  <text x="345" y="124" font-family="monospace" font-size="7" fill="#6a9bcc">python -m</text>
  <text x="335" y="138" font-family="monospace" font-size="7" fill="#6a9bcc">  debugpy</text>
  <text x="335" y="152" font-family="monospace" font-size="7" fill="#d97757">  --listen</text>
  <text x="335" y="166" font-family="monospace" font-size="7" fill="#788c5d">  --wait-for-client</text>
  <text x="335" y="178" font-family="monospace" font-size="7" fill="#fff">  train.py</text>

  <text x="385" y="206" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">在服务器上运行</text>
  <text x="385" y="220" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">等待编辑器连接</text>

  <!-- Arrow 3→4 -->
  <line x1="453" y1="162" x2="464" y2="162" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 4 ===== -->
  <rect x="468" y="72" width="136" height="180" rx="10" fill="#e8e6dc" filter="url(#sh)"/>
  <circle cx="493" cy="92" r="14" fill="#d97757"/>
  <text x="493" y="97" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#fff">4</text>
  <text x="516" y="97" font-family="Lora,Georgia,serif" font-size="11" font-weight="bold" fill="#141413">配置编辑器</text>

  <rect x="478" y="108" width="116" height="72" rx="5" fill="#141413"/>
  <text x="486" y="125" font-family="monospace" font-size="7" fill="#b0aea5">launch.json</text>
  <line x1="486" y1="129" x2="586" y2="129" stroke="#333" stroke-width="0.5"/>
  <text x="486" y="141" font-family="monospace" font-size="7" fill="#6a9bcc">"type"</text>
  <text x="524" y="141" font-family="monospace" font-size="7" fill="#fff">: "debugpy"</text>
  <text x="486" y="153" font-family="monospace" font-size="6.5" fill="#6a9bcc">"connect"</text>
  <text x="486" y="165" font-family="monospace" font-size="6.5" fill="#b0aea5"> "host"</text>
  <text x="486" y="177" font-family="monospace" font-size="6.5" fill="#b0aea5"> "port"</text>

  <text x="536" y="206" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">VSCode / Cursor</text>
  <text x="536" y="220" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">Windsurf 通用</text>

  <!-- Arrow 4→5 -->
  <line x1="604" y1="162" x2="615" y2="162" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 5 ===== -->
  <rect x="619" y="72" width="126" height="180" rx="10" fill="#e8e6dc" filter="url(#sh)"/>
  <circle cx="643" cy="92" r="14" fill="#d97757"/>
  <text x="643" y="97" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#fff">5</text>
  <text x="666" y="97" font-family="Lora,Georgia,serif" font-size="11" font-weight="bold" fill="#141413">开始调试</text>

  <!-- Play button -->
  <polygon points="652,125 692,145 652,165" fill="#788c5d" stroke="#788c5d" stroke-width="1"/>

  <!-- Breakpoint visual -->
  <rect x="637" y="182" width="50" height="22" rx="4" fill="#fff" stroke="#b0aea5" stroke-width="0.5"/>
  <circle cx="647" cy="193" r="4" fill="#d97757"/>
  <text x="660" y="197" font-family="monospace" font-size="7" fill="#141413">x = 42</text>

  <text x="682" y="236" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">F5 运行</text>
  <text x="682" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">断点自动暂停</text>

  <!-- ===== BOTTOM SUCCESS MESSAGE ===== -->
  <rect x="100" y="270" width="560" height="52" rx="10" fill="#e8e6dc" filter="url(#sh)"/>
  <circle cx="126" cy="296" r="8" fill="#788c5d"/>
  <text x="126" y="300" text-anchor="middle" font-family="monospace" font-size="10" fill="#fff">✓</text>
  <text x="380" y="296" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" fill="#788c5d" font-weight="bold">现在你可以像调试本地代码一样调试远程代码</text>
  <text x="380" y="313" text-anchor="middle" font-family="monospace" font-size="10" fill="#b0aea5">设置断点 · 查看变量 · 单步执行 · 查看调用堆栈 — 全部可用</text>

  <!-- ===== Step labels at bottom ===== -->
  <rect x="100" y="340" width="560" height="105" rx="10" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>

  <text x="125" y="365" font-family="monospace" font-size="9" fill="#141413" font-weight="bold">快捷参考</text>

  <!-- Row 1 -->
  <rect x="120" y="378" width="8" height="8" rx="2" fill="#d97757"/>
  <text x="133" y="385" font-family="monospace" font-size="8.5" fill="#141413">pip install debugpy</text>
  <rect x="300" y="378" width="8" height="8" rx="2" fill="#d97757"/>
  <text x="313" y="385" font-family="monospace" font-size="8.5" fill="#141413">LocalForward 5678 localhost:5678</text>
  <rect x="510" y="378" width="8" height="8" rx="2" fill="#d97757"/>
  <text x="523" y="385" font-family="monospace" font-size="8.5" fill="#141413">debugpy --listen :5678 --wait-for-client</text>

  <!-- Row 2 -->
  <rect x="120" y="398" width="8" height="8" rx="2" fill="#d97757"/>
  <text x="133" y="405" font-family="monospace" font-size="8.5" fill="#141413">type: debugpy, connect: localhost:5678</text>
  <rect x="412" y="398" width="8" height="8" rx="2" fill="#d97757"/>
  <text x="425" y="405" font-family="monospace" font-size="8.5" fill="#141413">F5 → Python: Remote Attach</text>
</svg>
