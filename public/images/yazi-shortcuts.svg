<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="400" rx="12" fill="#faf9f5"/>

  <!-- Header -->
  <text x="400" y="38" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">Yazi 快捷键速查</text>
  <text x="400" y="60" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#b0aea5">vim 风格操作，零学习成本 — 左侧终端预览，右侧快捷键参考</text>

  <!-- ====== LEFT: Terminal Mockup ====== -->
  <rect x="36" y="74" width="362" height="310" rx="6" fill="#141413" filter="url(#s)"/>

  <!-- Terminal title bar -->
  <rect x="36" y="74" width="362" height="28" rx="6" fill="#141413"/>
  <rect x="36" y="96" width="362" height="6" rx="0" fill="#141413"/>
  <circle cx="56" cy="88" r="5" fill="#d97757"/>
  <circle cx="72" cy="88" r="5" fill="#6a9bcc" opacity="0.6"/>
  <circle cx="88" cy="88" r="5" fill="#788c5d" opacity="0.7"/>
  <text x="217" y="92" text-anchor="middle" font-family="monospace" font-size="10" fill="#faf9f5">Tab 1 · ~/projects</text>
  <rect x="298" y="81" width="44" height="14" rx="7" fill="#d97757" opacity="0.25"/>
  <text x="320" y="91" text-anchor="middle" font-family="monospace" font-size="8" fill="#faf9f5">Tab 1</text>
  <rect x="346" y="81" width="44" height="14" rx="7" fill="rgba(250,249,245,0.12)"/>
  <text x="368" y="91" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">Tab 2</text>

  <!-- Terminal content: file listing with colored icons -->
  <text x="54" y="120" font-family="monospace" font-size="12" fill="#6a9bcc">&#xee5b;</text>
  <text x="74" y="120" font-family="monospace" font-size="12" fill="#faf9f5">src/</text>

  <text x="54" y="142" font-family="monospace" font-size="12" fill="#6a9bcc">&#xee5b;</text>
  <text x="74" y="142" font-family="monospace" font-size="12" fill="#faf9f5">tests/</text>

  <!-- Cursor/highlight line -->
  <rect x="44" y="152" width="344" height="20" rx="3" fill="#d97757" opacity="0.15"/>
  <text x="54" y="166" font-family="monospace" font-size="12" fill="#788c5d">&#xee5e;</text>
  <text x="74" y="166" font-family="monospace" font-size="12" fill="#faf9f5">app.rs</text>

  <text x="54" y="188" font-family="monospace" font-size="12" fill="#d97757">&#xeda6;</text>
  <text x="74" y="188" font-family="monospace" font-size="12" fill="#faf9f5">config.toml</text>

  <text x="54" y="210" font-family="monospace" font-size="12" fill="#6a9bcc">&#xf48a;</text>
  <text x="74" y="210" font-family="monospace" font-size="12" fill="#faf9f5">README.md</text>

  <text x="54" y="232" font-family="monospace" font-size="12" fill="#d97757">&#xeba8;</text>
  <text x="74" y="232" font-family="monospace" font-size="12" fill="#faf9f5">screenshot.png</text>

  <text x="54" y="254" font-family="monospace" font-size="12" fill="#b0aea5">&#xf15b;</text>
  <text x="74" y="254" font-family="monospace" font-size="12" fill="#b0aea5">.gitignore</text>

  <!-- Divider line -->
  <line x1="44" y1="270" x2="388" y2="270" stroke="rgba(250,249,245,0.08)" stroke-width="1"/>

  <!-- Status bar -->
  <text x="54" y="294" font-family="monospace" font-size="10" fill="#b0aea5">3/8</text>
  <text x="80" y="294" font-family="monospace" font-size="10" fill="#788c5d">y 复制</text>
  <text x="128" y="294" font-family="monospace" font-size="10" fill="#788c5d">p 粘贴</text>
  <text x="180" y="294" font-family="monospace" font-size="10" fill="#6a9bcc">/ 搜索</text>
  <text x="228" y="294" font-family="monospace" font-size="10" fill="#b0aea5">Space 选择</text>

  <text x="330" y="294" text-anchor="end" font-family="monospace" font-size="10" fill="#b0aea5">1/3 tabs</text>

  <!-- Cursor indicator arrow -->
  <text x="38" y="166" font-family="monospace" font-size="10" fill="#d97757" font-weight="700">&#x25b6;</text>

  <!-- ====== RIGHT: Shortcut Reference ====== -->

  <!-- Card 1: Navigation -->
  <rect x="420" y="74" width="352" height="74" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1" filter="url(#s)"/>
  <rect x="420" y="74" width="6" height="74" rx="3" fill="#6a9bcc"/>
  <text x="438" y="95" font-family="Lora,Georgia,serif" font-size="12" font-weight="700" fill="#6a9bcc">导航</text>
  <text x="438" y="115" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">上下移动</text>
  <text x="672" y="115" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">j / k  &#x2191;&#x2193;</text>
  <text x="438" y="133" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">进入/返回    顶部/底部</text>
  <text x="672" y="133" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">l Enter / h  g / G</text>

  <!-- Card 2: File Operations -->
  <rect x="420" y="156" width="352" height="74" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1" filter="url(#s)"/>
  <rect x="420" y="156" width="6" height="74" rx="3" fill="#788c5d"/>
  <text x="438" y="177" font-family="Lora,Georgia,serif" font-size="12" font-weight="700" fill="#788c5d">文件操作</text>
  <text x="438" y="197" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">复制/粘贴    新建/重命名</text>
  <text x="672" y="197" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">y p / a r</text>
  <text x="438" y="215" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">删除/选择    移动文件</text>
  <text x="672" y="215" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">d / Space  x</text>

  <!-- Card 3: Tabs -->
  <rect x="420" y="238" width="352" height="74" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1" filter="url(#s)"/>
  <rect x="420" y="238" width="6" height="74" rx="3" fill="#d97757"/>
  <text x="438" y="259" font-family="Lora,Georgia,serif" font-size="12" font-weight="700" fill="#d97757">标签页</text>
  <text x="438" y="279" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">新建/关闭    切换标签</text>
  <text x="672" y="279" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">t / q  1 2 3</text>
  <text x="438" y="297" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">上一个/下一个</text>
  <text x="672" y="297" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">[ / ]</text>

  <!-- Card 4: Search -->
  <rect x="420" y="320" width="352" height="64" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1" filter="url(#s)"/>
  <rect x="420" y="320" width="6" height="64" rx="3" fill="#6a9bcc"/>
  <text x="438" y="341" font-family="Lora,Georgia,serif" font-size="12" font-weight="700" fill="#6a9bcc">搜索</text>
  <text x="438" y="361" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">文件搜索    下/上匹配    切换隐藏</text>
  <text x="672" y="361" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">/  n N  .</text>

</svg>
