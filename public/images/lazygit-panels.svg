<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="400" rx="12" fill="#faf9f5"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">Lazygit 5 面板布局</text>
  <text x="400" y="60" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#b0aea5">按 1-5 数字键切换焦点面板 · 所有信息一览无余</text>

  <!-- Terminal window frame -->
  <rect x="60" y="82" width="680" height="28" rx="5" fill="#141413"/>
  <circle cx="80" cy="96" r="5" fill="#d97757"/>
  <circle cx="96" cy="96" r="5" fill="#6a9bcc" opacity="0.6"/>
  <circle cx="112" cy="96" r="5" fill="#788c5d" opacity="0.7"/>
  <text x="400" y="101" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="#faf9f5">lazygit — 终端 Git GUI</text>

  <!-- Panel 1: Status / Files -->
  <rect x="60" y="110" width="680" height="52" rx="0" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="60" y="110" width="680" height="28" fill="#d97757" opacity="0.10"/>
  <text x="76" y="130" font-family="monospace" font-size="11" fill="#141413" font-weight="600">1. Status / Files</text>
  <rect x="224" y="117" width="46" height="16" rx="8" fill="#d97757" opacity="0.18"/>
  <text x="247" y="129" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757" font-weight="700">Space</text>
  <text x="76" y="152" font-family="monospace" font-size="10" fill="#b0aea5">Unstaged ▸ Staged · 查看修改、暂存文件、提交</text>

  <!-- Panel 2: Branches -->
  <rect x="60" y="162" width="680" height="52" rx="0" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="60" y="162" width="680" height="28" fill="#6a9bcc" opacity="0.10"/>
  <text x="76" y="182" font-family="monospace" font-size="11" fill="#141413" font-weight="600">2. Branches</text>
  <rect x="224" y="169" width="34" height="16" rx="8" fill="#6a9bcc" opacity="0.18"/>
  <text x="241" y="181" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a9bcc" font-weight="700">n</text>
  <text x="76" y="204" font-family="monospace" font-size="10" fill="#b0aea5">main · feature · dev · 切换/新建/删除/合并</text>

  <!-- Panel 3: Commits / Log -->
  <rect x="60" y="214" width="680" height="52" rx="0" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="60" y="214" width="680" height="28" fill="#788c5d" opacity="0.10"/>
  <text x="76" y="234" font-family="monospace" font-size="11" fill="#141413" font-weight="600">3. Commits / Log</text>
  <rect x="224" y="221" width="34" height="16" rx="8" fill="#788c5d" opacity="0.18"/>
  <text x="241" y="233" text-anchor="middle" font-family="monospace" font-size="9" fill="#788c5d" font-weight="700">i</text>
  <text x="76" y="256" font-family="monospace" font-size="10" fill="#b0aea5">a1b2c3 · d4e5f6 · g7h8i9 · 浏览历史、cherry-pick、rebase</text>

  <!-- Panel 4: Stash -->
  <rect x="60" y="266" width="680" height="52" rx="0" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="60" y="266" width="680" height="28" fill="#b0aea5" opacity="0.10"/>
  <text x="76" y="286" font-family="monospace" font-size="11" fill="#141413" font-weight="600">4. Stash</text>
  <rect x="224" y="273" width="34" height="16" rx="8" fill="#b0aea5" opacity="0.18"/>
  <text x="241" y="285" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a5955" font-weight="700">s</text>
  <text x="76" y="308" font-family="monospace" font-size="10" fill="#b0aea5">WIP: training config · 储藏/恢复工作区修改</text>

  <!-- Panel 5: Diff View -->
  <rect x="60" y="318" width="680" height="42" rx="0" fill="#141413"/>
  <text x="76" y="339" font-family="monospace" font-size="11" fill="#b0aea5" font-weight="600">Diff View (底部)</text>
  <text x="400" y="339" text-anchor="middle" font-family="monospace" font-size="10" fill="#788c5d" opacity="0.8">- old line</text>
  <text x="500" y="339" text-anchor="middle" font-family="monospace" font-size="10" fill="#d97757" opacity="0.8">+ new line</text>

  <!-- Bottom annotation -->
  <rect x="60" y="372" width="680" height="20" rx="6" fill="#141413" opacity="0.04"/>
  <text x="400" y="386" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413">
    按
    <tspan fill="#d97757" font-weight="700" font-family="monospace">1-5</tspan>
     数字键切换焦点面板，按
    <tspan fill="#6a9bcc" font-weight="700" font-family="monospace">Tab</tspan>
     在同面板区域间跳转
  </text>
</svg>
