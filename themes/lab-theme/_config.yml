# Lab Theme — Anthropic-style custom Hexo theme
# =============================================

# Navigation menu items
menu:
  Home: /
  Archives: /archives
  About: /about

# Post display
index_generator:
  per_page: 10
  order_by: -date

archive_generator:
  per_page: 0
  yearly: true
  monthly: false
  daily: false

# Code highlighting
highlight:
  enable: true
  line_number: true
  wrap: true
  theme: default

# Default language
language: zh-CN

# Footer copyright
copyright: "© %d Lab Team"
