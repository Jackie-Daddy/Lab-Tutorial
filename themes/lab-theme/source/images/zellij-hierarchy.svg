<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#141413" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="12" fill="#faf9f5"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">Zellij 分层架构</text>

  <!-- === Session Level === -->
  <rect x="270" y="70" width="260" height="52" rx="8" fill="#141413" filter="url(#shadow)"/>
  <text x="400" y="101" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="18" font-weight="700" fill="#faf9f5">Session（会话）</text>
  <text x="400" y="134" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#b0aea5">zellij -s project-name</text>

  <!-- Connector: Session → Tabs -->
  <line x1="400" y1="122" x2="400" y2="150" stroke="#d97757" stroke-width="2"/>
  <line x1="400" y1="150" x2="130" y2="150" stroke="#d97757" stroke-width="1.5"/>
  <line x1="400" y1="150" x2="400" y2="150" stroke="#d97757" stroke-width="1.5"/>
  <line x1="400" y1="150" x2="670" y2="150" stroke="#d97757" stroke-width="1.5"/>
  <line x1="130" y1="150" x2="130" y2="168" stroke="#d97757" stroke-width="1.5"/>
  <line x1="400" y1="150" x2="400" y2="168" stroke="#d97757" stroke-width="1.5"/>
  <line x1="670" y1="150" x2="670" y2="168" stroke="#d97757" stroke-width="1.5"/>

  <!-- === Tab Level === -->
  <rect x="55" y="170" width="150" height="44" rx="6" fill="#6a9bcc" filter="url(#shadow)"/>
  <text x="130" y="192" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">Tab 1 · Dev</text>
  <text x="130" y="208" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="rgba(250,249,245,0.7)">Ctrl+O → 1</text>

  <rect x="325" y="170" width="150" height="44" rx="6" fill="#788c5d" filter="url(#shadow)"/>
  <text x="400" y="192" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">Tab 2 · Git</text>
  <text x="400" y="208" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="rgba(250,249,245,0.7)">Ctrl+O → 2</text>

  <rect x="595" y="170" width="150" height="44" rx="6" fill="#b0aea5" filter="url(#shadow)"/>
  <text x="670" y="192" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">Tab 3 · Logs</text>
  <text x="670" y="208" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="rgba(250,249,245,0.7)">Ctrl+O → 3</text>

  <!-- Connectors: Tab 1 → Panes -->
  <line x1="130" y1="214" x2="130" y2="242" stroke="#d97757" stroke-width="1.5"/>
  <line x1="130" y1="242" x2="52" y2="242" stroke="#d97757" stroke-width="1.5"/>
  <line x1="130" y1="242" x2="208" y2="242" stroke="#d97757" stroke-width="1.5"/>
  <line x1="52" y1="242" x2="52" y2="260" stroke="#d97757" stroke-width="1.5"/>
  <line x1="208" y1="242" x2="208" y2="260" stroke="#d97757" stroke-width="1.5"/>

  <!-- === Pane Level (Tab 1 expanded) === -->
  <rect x="18" y="262" width="68" height="52" rx="6" fill="#e8e6dc" stroke="#b0aea5" stroke-width="1"/>
  <text x="52" y="284" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">Pane</text>
  <text x="52" y="300" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#b0aea5">Yazi</text>

  <rect x="98" y="262" width="68" height="52" rx="6" fill="#e8e6dc" stroke="#b0aea5" stroke-width="1"/>
  <text x="132" y="284" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">Pane</text>
  <text x="132" y="300" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#b0aea5">Shell</text>

  <rect x="178" y="262" width="68" height="52" rx="6" fill="#e8e6dc" stroke="#b0aea5" stroke-width="1"/>
  <text x="212" y="284" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="600" fill="#141413">Pane</text>
  <text x="212" y="300" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#b0aea5">Claude</text>

  <!-- "× N" for other tabs -->
  <text x="325" y="292" font-family="Lora,Georgia,serif" font-size="13" fill="#b0aea5" font-style="italic">× N 个窗格</text>

  <!-- Legend side -->
  <rect x="620" y="270" width="155" height="130" rx="8" fill="#141413" opacity="0.04"/>
  <text x="697" y="294" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" font-weight="700" fill="#141413">快捷键</text>
  <line x1="635" y1="303" x2="760" y2="303" stroke="#e8e6dc" stroke-width="1"/>
  <text x="635" y="322" font-family="Lora,Georgia,serif" font-size="12" fill="#141413">新建标签页</text>
  <text x="750" y="322" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">Ctrl+O N</text>
  <text x="635" y="344" font-family="Lora,Georgia,serif" font-size="12" fill="#141413">向下分屏</text>
  <text x="750" y="344" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">Ctrl+O D</text>
  <text x="635" y="366" font-family="Lora,Georgia,serif" font-size="12" fill="#141413">切换焦点</text>
  <text x="750" y="366" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">h j k l</text>
  <text x="635" y="388" font-family="Lora,Georgia,serif" font-size="12" fill="#141413">断开会话</text>
  <text x="750" y="388" text-anchor="end" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">Ctrl+O D</text>

  <!-- Callout annotation -->
  <rect x="245" y="340" width="200" height="28" rx="14" fill="#d97757" opacity="0.12"/>
  <text x="345" y="358" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#d97757" font-weight="600">关闭窗口 ≠ 结束任务</text>
</svg>
