<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" fill="none">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97757"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#788c5d"/>
    </marker>
  </defs>

  <rect width="800" height="390" rx="12" fill="#faf9f5"/>

  <text x="400" y="34" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">内网代理上网 — 网络拓扑</text>
  <text x="400" y="54" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">服务器 → 笔记本 → 互联网</text>

  <!-- ====== Left: Server ====== -->
  <rect x="30" y="80" width="200" height="180" rx="12" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5" filter="url(#sh)"/>

  <!-- Server icon -->
  <g transform="translate(85, 100)" fill="none" stroke="#141413" stroke-width="1.5">
    <rect x="0" y="0" width="30" height="40" rx="3"/>
    <rect x="4" y="6" width="22" height="4" rx="1" fill="#e8e6dc"/>
    <rect x="4" y="13" width="22" height="4" rx="1" fill="#e8e6dc"/>
    <circle cx="15" cy="28" r="3" fill="#788c5d" stroke="none"/>
    <circle cx="15" cy="35" r="2" fill="#b0aea5" stroke="none"/>
  </g>

  <text x="130" y="100" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#141413">内网服务器</text>
  <text x="130" y="118" font-family="Lora,Georgia,serif" font-size="10" fill="#b0aea5">无外网访问能力</text>

  <!-- Server detail lines -->
  <line x1="50" y1="140" x2="210" y2="140" stroke="#e8e6dc" stroke-width="0.5"/>
  <rect x="50" y="150" width="160" height="24" rx="4" fill="#141413"/>
  <text x="60" y="166" font-family="monospace" font-size="9" fill="#6a9bcc">$</text>
  <text x="70" y="166" font-family="monospace" font-size="9" fill="#faf9f5">curl github.com</text>
  <text x="60" y="180" font-family="monospace" font-size="8" fill="#d97757">✗ Connection timed out</text>

  <text x="130" y="208" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#b0aea5">需要代理才能访问外网</text>
  <text x="130" y="224" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757">export http_proxy=...</text>
  <text x="130" y="240" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757">export https_proxy=...</text>

  <!-- Arrow Server → Laptop -->
  <line x1="230" y1="170" x2="310" y2="170" stroke="#d97757" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="270" y="160" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757" font-weight="600">http_proxy</text>

  <!-- ====== Middle: Laptop (highlighted) ====== -->
  <rect x="310" y="80" width="200" height="180" rx="12" fill="#faf9f5" stroke="#d97757" stroke-width="2.5" filter="url(#sh)"/>

  <!-- Orange glow ring -->
  <rect x="306" y="76" width="208" height="188" rx="14" fill="none" stroke="#d97757" stroke-width="1" opacity="0.15"/>

  <!-- Laptop icon -->
  <g transform="translate(370, 98)" fill="none" stroke="#141413" stroke-width="1.5">
    <rect x="0" y="0" width="28" height="20" rx="2"/>
    <rect x="4" y="20" width="20" height="2" rx="1"/>
    <line x1="8" y1="22" x2="5" y2="28"/>
    <line x1="20" y1="22" x2="23" y2="28"/>
    <line x1="5" y1="28" x2="23" y2="28"/>
  </g>

  <text x="410" y="100" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#141413">你的笔记本</text>
  <text x="410" y="118" font-family="Lora,Georgia,serif" font-size="10" fill="#788c5d">运行代理软件 ✓</text>

  <line x1="330" y1="135" x2="490" y2="135" stroke="#e8e6dc" stroke-width="0.5"/>

  <!-- Clash logo placeholder -->
  <rect x="340" y="145" width="44" height="20" rx="5" fill="#d97757"/>
  <text x="362" y="159" text-anchor="middle" font-family="monospace" font-size="9" fill="#faf9f5" font-weight="700">Clash</text>

  <rect x="394" y="145" width="100" height="20" rx="5" fill="#e8e6dc"/>
  <text x="444" y="159" text-anchor="middle" font-family="monospace" font-size="9" fill="#141413" font-weight="600">192.168.1.100</text>
  <rect x="340" y="172" width="154" height="20" rx="5" fill="#e8e6dc"/>
  <text x="417" y="186" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757" font-weight="600">:7890</text>

  <text x="410" y="210" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#5a5955">代理地址（端口）</text>
  <text x="410" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#141413" font-weight="600">http://192.168.1.100:7890</text>
  <text x="410" y="246" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="9" fill="#788c5d">允许局域网连接</text>

  <!-- Arrow Laptop → Internet -->
  <line x1="510" y1="170" x2="590" y2="170" stroke="#788c5d" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="550" y="160" text-anchor="middle" font-family="monospace" font-size="9" fill="#788c5d" font-weight="600">代理转发</text>

  <!-- ====== Right: Internet ====== -->
  <rect x="590" y="80" width="180" height="180" rx="12" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5" filter="url(#sh)"/>

  <!-- Cloud icon -->
  <g transform="translate(648, 98)" fill="none" stroke="#6a9bcc" stroke-width="1.5">
    <path d="M5,20 Q5,10 15,8 Q20,2 28,8 Q38,6 38,16 Q42,18 38,22 L5,22 Z"/>
  </g>

  <text x="680" y="100" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#141413">互联网</text>

  <line x1="610" y1="130" x2="750" y2="130" stroke="#e8e6dc" stroke-width="0.5"/>

  <!-- Service logos -->
  <rect x="610" y="140" width="140" height="22" rx="4" fill="#e8e6dc"/>
  <circle cx="628" cy="151" r="4" fill="#141413"/>
  <text x="640" y="155" font-family="monospace" font-size="9" fill="#141413" font-weight="600">GitHub</text>
  <text x="690" y="155" font-family="monospace" font-size="8" fill="#b0aea5">git clone</text>

  <rect x="610" y="168" width="140" height="22" rx="4" fill="#e8e6dc"/>
  <text x="680" y="183" text-anchor="middle" font-family="monospace" font-size="9" fill="#141413" font-weight="600">HuggingFace</text>

  <rect x="610" y="196" width="140" height="22" rx="4" fill="#e8e6dc"/>
  <text x="680" y="211" text-anchor="middle" font-family="monospace" font-size="9" fill="#141413" font-weight="600">pip / conda</text>

  <rect x="610" y="224" width="140" height="22" rx="4" fill="#e8e6dc"/>
  <text x="680" y="239" text-anchor="middle" font-family="monospace" font-size="9" fill="#141413" font-weight="600">wget / curl</text>

  <!-- ====== Bottom: Prerequisite note ====== -->
  <rect x="60" y="285" width="680" height="50" rx="10" fill="#141413" opacity="0.04"/>
  <text x="400" y="308" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#141413">
    前提：服务器和笔记本在
    <tspan fill="#d97757" font-weight="700">同一局域网</tspan>
    ，代理软件需开启
    <tspan fill="#d97757" font-weight="700">"允许局域网连接"</tspan>
  </text>
  <text x="400" y="326" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="#b0aea5">Clash: Allow LAN / V2Ray: 监听地址设为 0.0.0.0</text>

  <!-- Network flow lines below -->
  <line x1="130" y1="355" x2="400" y2="355" stroke="#e8e6dc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="355" x2="680" y2="355" stroke="#e8e6dc" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="130" cy="355" r="3" fill="#b0aea5"/>
  <circle cx="400" cy="355" r="4" fill="#d97757"/>
  <circle cx="680" cy="355" r="3" fill="#6a9bcc"/>
</svg>
