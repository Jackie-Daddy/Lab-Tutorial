<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" fill="none">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97757"/>
    </marker>
  </defs>

  <rect width="800" height="380" rx="12" fill="#faf9f5"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">交互式变基 (Interactive Rebase) — 整理提交历史</text>
  <text x="400" y="60" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#b0aea5">把多个杂乱提交合并成干净的历史，push 前整理一波</text>

  <!-- ====== Stage 1: Before ====== -->
  <rect x="40" y="85" width="220" height="200" rx="10" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="85" width="220" height="42" rx="10" fill="#141413"/>
  <rect x="40" y="107" width="220" height="20" fill="#141413"/>
  <text x="150" y="111" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">Stage 1 · 变基前</text>

  <!-- Commit bubbles -->
  <rect x="58" y="140" width="184" height="28" rx="6" fill="#b0aea5" opacity="0.12"/>
  <text x="74" y="158" font-family="monospace" font-size="9" fill="#5a5955">WIP2: more fixes</text>
  <text x="216" y="158" text-anchor="end" font-family="monospace" font-size="7" fill="#b0aea5">d4e5f6</text>

  <rect x="58" y="174" width="184" height="28" rx="6" fill="#6a9bcc" opacity="0.12"/>
  <text x="74" y="192" font-family="monospace" font-size="9" fill="#5a5955">add: new feature</text>
  <text x="216" y="192" text-anchor="end" font-family="monospace" font-size="7" fill="#b0aea5">g7h8i9</text>

  <rect x="58" y="208" width="184" height="28" rx="6" fill="#d97757" opacity="0.12"/>
  <text x="74" y="226" font-family="monospace" font-size="9" fill="#5a5955">WIP: debugging</text>
  <text x="216" y="226" text-anchor="end" font-family="monospace" font-size="7" fill="#b0aea5">j0k1l2</text>

  <rect x="58" y="242" width="184" height="28" rx="6" fill="#788c5d" opacity="0.12"/>
  <text x="74" y="260" font-family="monospace" font-size="9" fill="#5a5955">fix: typo in config</text>
  <text x="200" y="260" text-anchor="end" font-family="monospace" font-size="7" fill="#b0aea5">m3n4o5</text>

  <!-- Arrows between commits -->
  <path d="M150,168 L150,174" stroke="#b0aea5" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M150,202 L150,208" stroke="#b0aea5" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M150,236 L150,242" stroke="#b0aea5" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Arrow 1→2 -->
  <line x1="260" y1="185" x2="308" y2="185" stroke="#d97757" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="177" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="8" fill="#d97757" font-weight="600">3 → i</text>

  <!-- ====== Stage 2: Operation ====== -->
  <rect x="312" y="85" width="220" height="200" rx="10" fill="#faf9f5" stroke="#d97757" stroke-width="2" filter="url(#sh)"/>
  <rect x="312" y="85" width="220" height="42" rx="10" fill="#d97757"/>
  <rect x="312" y="107" width="220" height="20" fill="#d97757"/>
  <text x="422" y="111" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">Stage 2 · 操作 (i)</text>

  <rect x="328" y="140" width="188" height="32" rx="6" fill="#788c5d" opacity="0.12"/>
  <text x="344" y="155" font-family="monospace" font-size="9" fill="#788c5d" font-weight="600">pick</text>
  <text x="384" y="155" font-family="monospace" font-size="9" fill="#141413">fix: typo in config</text>
  <text x="498" y="155" text-anchor="end" font-family="monospace" font-size="7" fill="#b0aea5">m3n4o5</text>

  <rect x="328" y="178" width="188" height="32" rx="6" fill="#d97757" opacity="0.12"/>
  <text x="344" y="193" font-family="monospace" font-size="9" fill="#d97757" font-weight="600">squash</text>
  <text x="400" y="193" font-family="monospace" font-size="9" fill="#141413">WIP: debugging</text>
  <text x="498" y="193" text-anchor="end" font-family="monospace" font-size="7" fill="#b0aea5">j0k1l2</text>

  <rect x="328" y="216" width="188" height="32" rx="6" fill="#d97757" opacity="0.12"/>
  <text x="344" y="231" font-family="monospace" font-size="9" fill="#d97757" font-weight="600">fixup</text>
  <text x="392" y="231" font-family="monospace" font-size="9" fill="#141413">WIP2: more fixes</text>
  <text x="498" y="231" text-anchor="end" font-family="monospace" font-size="7" fill="#b0aea5">d4e5f6</text>

  <text x="422" y="268" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757">s = squash · f = fixup</text>

  <!-- Arrow 2→3 -->
  <line x1="532" y1="185" x2="580" y2="185" stroke="#d97757" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="556" y="177" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="8" fill="#d97757" font-weight="600">确认</text>

  <!-- ====== Stage 3: After ====== -->
  <rect x="584" y="85" width="176" height="200" rx="10" fill="#faf9f5" stroke="#788c5d" stroke-width="2" filter="url(#sh)"/>
  <rect x="584" y="85" width="176" height="42" rx="10" fill="#788c5d"/>
  <rect x="584" y="107" width="176" height="20" fill="#788c5d"/>
  <text x="672" y="111" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">Stage 3 · 变基后</text>

  <rect x="598" y="142" width="148" height="56" rx="8" fill="#788c5d" opacity="0.10"/>
  <text x="672" y="163" text-anchor="middle" font-family="monospace" font-size="10" fill="#141413" font-weight="600">add: new feature</text>
  <text x="672" y="182" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">(merged 3 commits)</text>
  <text x="672" y="194" text-anchor="end" font-family="monospace" font-size="7" fill="#b0aea5">g7h8i9</text>

  <rect x="598" y="206" width="148" height="42" rx="8" fill="#788c5d" opacity="0.10"/>
  <text x="672" y="225" text-anchor="middle" font-family="monospace" font-size="10" fill="#141413" font-weight="600">fix: typo in config</text>
  <text x="624" y="242" text-anchor="end" font-family="monospace" font-size="7" fill="#b0aea5">m3n4o5</text>

  <text x="672" y="268" text-anchor="middle" font-family="monospace" font-size="9" fill="#788c5d" font-weight="600">历史干净了 ✓</text>

  <!-- Bottom annotation -->
  <rect x="60" y="310" width="680" height="55" rx="8" fill="#141413" opacity="0.04"/>
  <text x="400" y="335" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#141413">
    在 Commits 面板 (按
    <tspan font-family="monospace" fill="#d97757" font-weight="700">3</tspan>
    ) 选中最早要合并的提交，按
    <tspan font-family="monospace" fill="#d97757" font-weight="700">i</tspan>
     进入交互式变基
  </text>
  <text x="400" y="355" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">
    对后续提交按
    <tspan font-family="monospace" fill="#d97757">s</tspan>
    (squash: 合并 + 保留 message) 或
    <tspan font-family="monospace" fill="#d97757">f</tspan>
    (fixup: 合并 + 丢弃 message) · 确认后如需强推用
    <tspan font-family="monospace" fill="#d97757" font-weight="600">Shift+P</tspan>
  </text>
</svg>
