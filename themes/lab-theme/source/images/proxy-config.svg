<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" fill="none">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="350" rx="12" fill="#faf9f5"/>

  <text x="400" y="34" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">配置方式对比 — 临时 vs 永久</text>
  <text x="400" y="54" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">两种方式各有用途，根据场景选择</text>

  <!-- ====== Card A: Temporary (Orange) ====== -->
  <rect x="30" y="74" width="360" height="195" rx="10" fill="#faf9f5" stroke="#d97757" stroke-width="2" filter="url(#sh)"/>

  <!-- Orange header -->
  <rect x="30" y="74" width="360" height="42" rx="10" fill="#d97757"/>
  <rect x="30" y="96" width="360" height="20" fill="#d97757"/>
  <text x="210" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="15" font-weight="700" fill="#faf9f5">临时配置</text>
  <!-- Clock icon -->
  <circle cx="310" cy="95" r="10" fill="none" stroke="#faf9f5" stroke-width="1.5" opacity="0.5"/>
  <line x1="310" y1="95" x2="310" y2="89" stroke="#faf9f5" stroke-width="1" opacity="0.5"/>
  <line x1="310" y1="95" x2="316" y2="95" stroke="#faf9f5" stroke-width="1" opacity="0.5"/>

  <!-- Terminal -->
  <rect x="50" y="126" width="320" height="70" rx="6" fill="#141413"/>
  <text x="65" y="144" font-family="monospace" font-size="10" fill="#6a9bcc">$</text>
  <text x="76" y="144" font-family="monospace" font-size="10" fill="#faf9f5">export http_proxy=http://192.168.1.100:7890</text>
  <text x="65" y="161" font-family="monospace" font-size="10" fill="#6a9bcc">$</text>
  <text x="76" y="161" font-family="monospace" font-size="10" fill="#faf9f5">export https_proxy=http://192.168.1.100:7890</text>
  <text x="65" y="178" font-family="monospace" font-size="10" fill="#6a9bcc">$</text>
  <text x="76" y="178" font-family="monospace" font-size="10" fill="#faf9f5">curl -I https://www.google.com</text>
  <line x1="76" y1="186" x2="130" y2="186" stroke="#b0aea5" stroke-width="0.5"/>

  <!-- Annotation -->
  <rect x="50" y="206" width="320" height="24" rx="5" fill="#d97757" opacity="0.08"/>
  <text x="210" y="222" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#d97757">仅当前终端有效，关闭即失效</text>

  <!-- VS divider -->
  <rect x="390" y="150" width="20" height="20" rx="10" fill="#e8e6dc"/>
  <text x="400" y="165" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#b0aea5" font-weight="600">vs</text>

  <!-- ====== Card B: Permanent (Green) ====== -->
  <rect x="410" y="74" width="360" height="195" rx="10" fill="#faf9f5" stroke="#788c5d" stroke-width="2" filter="url(#sh)"/>

  <!-- Green header -->
  <rect x="410" y="74" width="360" height="42" rx="10" fill="#788c5d"/>
  <rect x="410" y="96" width="360" height="20" fill="#788c5d"/>
  <text x="590" y="100" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="15" font-weight="700" fill="#faf9f5">永久配置</text>
  <!-- Checkmark icon -->
  <circle cx="690" cy="95" r="10" fill="none" stroke="#faf9f5" stroke-width="1.5" opacity="0.5"/>
  <path d="M685,95 L689,99 L696,90" stroke="#faf9f5" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- ~/.bashrc file visual -->
  <rect x="430" y="126" width="320" height="70" rx="6" fill="#141413"/>
  <!-- Title bar -->
  <rect x="430" y="126" width="320" height="16" rx="6" fill="#2a2a2a"/>
  <rect x="430" y="134" width="320" height="8" fill="#2a2a2a"/>
  <text x="590" y="137" text-anchor="middle" font-family="monospace" font-size="7" fill="#b0aea5">~/.bashrc</text>

  <text x="445" y="158" font-family="monospace" font-size="9" fill="#6a9bcc">export http_proxy=http://192.168.1.100:7890</text>
  <text x="445" y="172" font-family="monospace" font-size="9" fill="#6a9bcc">export https_proxy=http://192.168.1.100:7890</text>
  <text x="445" y="186" font-family="monospace" font-size="9" fill="#b0aea5"># 内网地址不走代理（重要！）</text>
  <text x="445" y="198" font-family="monospace" font-size="9" fill="#6a9bcc">export no_proxy=localhost,127.0.0.1,*.local,10.0.0.0/8,192.168.0.0/16</text>

  <!-- Annotation -->
  <rect x="430" y="206" width="320" height="24" rx="5" fill="#788c5d" opacity="0.08"/>
  <text x="590" y="222" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#788c5d">每次登录自动生效</text>

  <!-- ====== Bottom: Quick switch alias ====== -->
  <rect x="50" y="288" width="700" height="50" rx="10" fill="#141413" opacity="0.04"/>
  <text x="400" y="309" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#141413">快速切换 alias</text>
  <text x="160" y="327" font-family="monospace" font-size="10" fill="#141413" font-weight="600">alias proxy-on = 'export http_proxy=...'</text>
  <text x="440" y="327" font-family="monospace" font-size="10" fill="#d97757" font-weight="600">proxy-off</text>
  <text x="525" y="327" font-family="monospace" font-size="10" fill="#141413" font-weight="600">= 'unset http_proxy https_proxy'</text>
</svg>
