<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#141413" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141413"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" rx="12" fill="#faf9f5"/>

  <!-- Title -->
  <text x="350" y="42" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="bold" fill="#141413">效果对比 — 加上提示词前后</text>
  <line x1="220" y1="52" x2="480" y2="52" stroke="#d97757" stroke-width="2"/>

  <!-- ===== TABLE HEADER ===== -->
  <rect x="25" y="68" width="200" height="32" rx="6" fill="url(#headerGrad)"/>
  <text x="125" y="89" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="bold" fill="#fff">场景</text>

  <rect x="230" y="68" width="215" height="32" rx="6" fill="#b0aea5"/>
  <text x="337" y="89" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="bold" fill="#fff">默认回答</text>

  <rect x="450" y="68" width="225" height="32" rx="6" fill="#788c5d"/>
  <text x="562" y="89" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" font-weight="bold" fill="#fff">加上提示词后</text>

  <!-- ===== ROW 1 ===== -->
  <rect x="25" y="106" width="200" height="62" rx="6" fill="#e8e6dc"/>
  <text x="125" y="142" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#141413">写单例模式</text>

  <rect x="230" y="106" width="215" height="62" rx="6" fill="#e8e6dc"/>
  <text x="337" y="125" font-family="monospace" font-size="10" fill="#b0aea5">直接给代码：</text>
  <text x="337" y="142" font-family="monospace" font-size="10" fill="#b0aea5">class Singleton: ...</text>
  <text x="337" y="159" font-family="monospace" font-size="10" fill="#b0aea5">__new__ + _instance</text>

  <rect x="450" y="106" width="225" height="62" rx="6" fill="#e8e6dc"/>
  <text x="562" y="125" font-family="monospace" font-size="10" fill="#788c5d">先问：你确定需要单例？</text>
  <text x="562" y="142" font-family="monospace" font-size="10" fill="#788c5d">全局共享状态</text>
  <text x="562" y="159" font-family="monospace" font-size="10" fill="#788c5d">还是限制实例数？</text>

  <!-- ===== ROW 2 ===== -->
  <rect x="25" y="174" width="200" height="62" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="125" y="210" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#141413">优化性能</text>

  <rect x="230" y="174" width="215" height="62" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="337" y="193" font-family="monospace" font-size="10" fill="#b0aea5">给一堆微优化：</text>
  <text x="337" y="210" font-family="monospace" font-size="10" fill="#b0aea5">用列表推导式、</text>
  <text x="337" y="227" font-family="monospace" font-size="10" fill="#b0aea5">避免属性查找...</text>

  <rect x="450" y="174" width="225" height="62" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="562" y="193" font-family="monospace" font-size="10" fill="#788c5d">先问：你 profiled 了吗？</text>
  <text x="562" y="210" font-family="monospace" font-size="10" fill="#788c5d">瓶颈在哪里？</text>
  <text x="562" y="227" font-family="monospace" font-size="10" fill="#788c5d">不要过早优化。</text>

  <!-- ===== ROW 3 ===== -->
  <rect x="25" y="242" width="200" height="62" rx="6" fill="#e8e6dc"/>
  <text x="125" y="278" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#141413">用 Redis 缓存</text>

  <rect x="230" y="242" width="215" height="62" rx="6" fill="#e8e6dc"/>
  <text x="337" y="261" font-family="monospace" font-size="10" fill="#b0aea5">给 Redis 集成代码：</text>
  <text x="337" y="278" font-family="monospace" font-size="10" fill="#b0aea5">redis.set(key, value)</text>
  <text x="337" y="295" font-family="monospace" font-size="10" fill="#b0aea5">连接池配置...</text>

  <rect x="450" y="242" width="225" height="62" rx="6" fill="#e8e6dc"/>
  <text x="562" y="261" font-family="monospace" font-size="10" fill="#788c5d">先问：访问模式？</text>
  <text x="562" y="278" font-family="monospace" font-size="10" fill="#788c5d">内存缓存够不够？</text>
  <text x="562" y="295" font-family="monospace" font-size="10" fill="#788c5d">运维成本？</text>

  <!-- ===== BOTTOM CALLOUT ===== -->
  <rect x="50" y="320" width="600" height="52" rx="10" fill="#141413" filter="url(#sh)"/>
  <text x="350" y="343" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" fill="#fff">从「给代码」到「先思考」—— 这就是第一性原理的差别</text>
  <text x="350" y="362" text-anchor="middle" font-family="monospace" font-size="10" fill="#b0aea5">默认模式：直接给解决方案 / 加上提示词：先质疑需求、评估权衡、再给方案</text>
</svg>
