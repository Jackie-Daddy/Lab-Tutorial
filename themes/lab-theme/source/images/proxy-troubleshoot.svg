<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" fill="none">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#b0aea5"/>
    </marker>
    <marker id="arrowOrange" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#d97757"/>
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#788c5d"/>
    </marker>
  </defs>

  <rect width="800" height="310" rx="12" fill="#faf9f5"/>

  <text x="400" y="34" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">常见问题排查流程</text>
  <text x="400" y="54" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">三步定位法：症状 → 原因 → 解决</text>

  <!-- ====== Start Node ====== -->
  <ellipse cx="400" cy="82" rx="72" ry="20" fill="#d97757"/>
  <text x="400" y="87" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#faf9f5" font-weight="700">curl 连不上？</text>

  <!-- ====== Branch lines from start ====== -->
  <!-- Branch 1 (left) -->
  <line x1="340" y1="95" x2="150" y2="130" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch 2 (center) -->
  <line x1="400" y1="102" x2="400" y2="130" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch 3 (right) -->
  <line x1="460" y1="95" x2="650" y2="130" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== Branch 1: Connection refused ====== -->
  <rect x="25" y="134" width="250" height="36" rx="6" fill="#d97757" opacity="0.1" stroke="#d97757" stroke-width="1"/>
  <text x="150" y="157" text-anchor="middle" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">Connection refused</text>

  <line x1="150" y1="170" x2="150" y2="192" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="25" y="196" width="250" height="36" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="150" y="213" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">检查代理端口是否开放</text>
  <text x="150" y="226" text-anchor="middle" font-family="monospace" font-size="9" fill="#b0aea5">nc -zv 192.168.1.100 7890</text>

  <line x1="150" y1="232" x2="150" y2="254" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="25" y="258" width="250" height="36" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="150" y="275" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">检查防火墙规则</text>
  <text x="150" y="288" text-anchor="middle" font-family="monospace" font-size="9" fill="#b0aea5">sudo ufw status / iptables -L</text>

  <!-- Check -->
  <circle cx="150" cy="305" r="9" fill="#788c5d"/>
  <path d="M145,305 L149,309 L155,300" stroke="#faf9f5" stroke-width="2" fill="none"/>
  <text x="166" y="309" font-family="Lora,Georgia,serif" font-size="10" fill="#788c5d">解决</text>

  <!-- ====== Branch 2: Ping works but curl doesn't ====== -->
  <rect x="285" y="134" width="230" height="36" rx="6" fill="#6a9bcc" opacity="0.1" stroke="#6a9bcc" stroke-width="1"/>
  <text x="400" y="157" text-anchor="middle" font-family="monospace" font-size="11" fill="#6a9bcc" font-weight="600">能 ping 不通 curl</text>

  <line x1="400" y1="170" x2="400" y2="192" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="285" y="196" width="230" height="36" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="400" y="213" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">ping 走 ICMP 不过代理</text>
  <text x="400" y="226" text-anchor="middle" font-family="monospace" font-size="9" fill="#b0aea5">ICMP 协议不受 http_proxy 控制</text>

  <line x1="400" y1="232" x2="400" y2="254" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="285" y="258" width="230" height="36" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="400" y="275" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">用 curl -v 查看详情</text>
  <text x="400" y="288" text-anchor="middle" font-family="monospace" font-size="9" fill="#b0aea5">curl -v https://www.google.com</text>

  <circle cx="400" cy="305" r="9" fill="#788c5d"/>
  <path d="M395,305 L399,309 L405,300" stroke="#faf9f5" stroke-width="2" fill="none"/>
  <text x="416" y="309" font-family="Lora,Georgia,serif" font-size="10" fill="#788c5d">解决</text>

  <!-- ====== Branch 3: Internal services slow ====== -->
  <rect x="525" y="134" width="250" height="36" rx="6" fill="#b0aea5" opacity="0.12" stroke="#b0aea5" stroke-width="1"/>
  <text x="650" y="157" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a5955" font-weight="600">内网服务变慢</text>

  <line x1="650" y1="170" x2="650" y2="192" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="525" y="196" width="250" height="36" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="650" y="213" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">检查 no_proxy 设置</text>
  <text x="650" y="226" text-anchor="middle" font-family="monospace" font-size="9" fill="#b0aea5">echo $no_proxy</text>

  <line x1="650" y1="232" x2="650" y2="254" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="525" y="258" width="250" height="36" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="650" y="275" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="#141413">确认内网 IP 段已添加</text>
  <text x="650" y="288" text-anchor="middle" font-family="monospace" font-size="9" fill="#b0aea5">10.0.0.0/8, 192.168.0.0/16</text>

  <circle cx="650" cy="305" r="9" fill="#788c5d"/>
  <path d="M645,305 L649,309 L655,300" stroke="#faf9f5" stroke-width="2" fill="none"/>
  <text x="666" y="309" font-family="Lora,Georgia,serif" font-size="10" fill="#788c5d">解决</text>
</svg>
