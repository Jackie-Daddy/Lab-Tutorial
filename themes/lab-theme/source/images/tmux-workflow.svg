<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97757"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="12" fill="#faf9f5"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">tmux 核心工作流 — 30 秒上手</text>
  <text x="400" y="56" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">理解 detach / attach — tmux 的灵魂</text>

  <!-- ====== Step 1: New Session ====== -->
  <rect x="30" y="82" width="170" height="150" rx="10" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="82" width="170" height="40" rx="10" fill="#141413"/>
  <rect x="30" y="102" width="170" height="20" fill="#141413"/>
  <text x="115" y="107" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">新建会话</text>
  <circle cx="46" cy="102" r="10" fill="#d97757" opacity="0.3"/>
  <text x="46" y="107" text-anchor="middle" font-family="monospace" font-size="10" fill="#d97757" font-weight="700">1</text>

  <!-- Terminal mockup -->
  <rect x="44" y="130" width="142" height="50" rx="4" fill="#141413"/>
  <text x="52" y="146" font-family="monospace" font-size="9" fill="#6a9bcc">$</text>
  <text x="62" y="146" font-family="monospace" font-size="9" fill="#faf9f5">tmux new -s train</text>
  <text x="52" y="162" font-family="monospace" font-size="9" fill="#788c5d">Session 'train' created</text>
  <line x1="52" y1="170" x2="112" y2="170" stroke="#b0aea5" stroke-width="0.5"/>
  <rect x="112" y="170" width="6" height="10" rx="3" fill="#faf9f5" opacity="0.6"/>

  <text x="115" y="202" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#5a5955">创建一个命名会话</text>
  <text x="115" y="218" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757" font-weight="600">new -s &lt;name&gt;</text>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="157" x2="218" y2="157" stroke="#d97757" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ====== Step 2: Run Tasks ====== -->
  <rect x="220" y="82" width="170" height="150" rx="10" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="220" y="82" width="170" height="40" rx="10" fill="#141413"/>
  <rect x="220" y="102" width="170" height="20" fill="#141413"/>
  <text x="305" y="107" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">跑任务</text>
  <circle cx="236" cy="102" r="10" fill="#d97757" opacity="0.3"/>
  <text x="236" y="107" text-anchor="middle" font-family="monospace" font-size="10" fill="#d97757" font-weight="700">2</text>

  <rect x="234" y="130" width="142" height="50" rx="4" fill="#141413"/>
  <text x="242" y="146" font-family="monospace" font-size="9" fill="#6a9bcc">$</text>
  <text x="252" y="146" font-family="monospace" font-size="9" fill="#faf9f5">python train.py</text>
  <text x="242" y="162" font-family="monospace" font-size="9" fill="#b0aea5">Epoch 1/10: loss=0.43</text>
  <line x1="242" y1="170" width="6" height="10" rx="3" fill="#faf9f5" opacity="0.6"/>

  <text x="305" y="202" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#5a5955">在会话里正常跑命令</text>
  <text x="305" y="218" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757" font-weight="600">python / bash / 任意</text>

  <!-- Arrow 2→3 -->
  <line x1="390" y1="157" x2="408" y2="157" stroke="#d97757" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ====== Step 3: Detach ====== -->
  <rect x="410" y="82" width="170" height="150" rx="10" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="410" y="82" width="170" height="40" rx="10" fill="#e8e6dc"/>
  <rect x="410" y="102" width="170" height="20" fill="#e8e6dc"/>
  <text x="495" y="107" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#141413">断开</text>
  <circle cx="426" cy="102" r="10" fill="#d97757" opacity="0.3"/>
  <text x="426" y="107" text-anchor="middle" font-family="monospace" font-size="10" fill="#d97757" font-weight="700">3</text>

  <!-- Keycap visual -->
  <rect x="424" y="134" width="142" height="46" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <text x="465" y="146" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a5955">组合键</text>
  <!-- Ctrl keycap -->
  <rect x="440" y="152" width="30" height="20" rx="4" fill="#141413"/>
  <text x="455" y="166" text-anchor="middle" font-family="monospace" font-size="9" fill="#faf9f5" font-weight="600">Ctrl</text>
  <text x="474" y="166" font-family="monospace" font-size="11" fill="#141413">+</text>
  <!-- B keycap -->
  <rect x="483" y="152" width="18" height="20" rx="4" fill="#141413"/>
  <text x="492" y="166" text-anchor="middle" font-family="monospace" font-size="10" fill="#faf9f5" font-weight="600">B</text>
  <text x="506" y="166" font-family="monospace" font-size="9" fill="#141413">,</text>
  <!-- D keycap -->
  <rect x="514" y="152" width="18" height="20" rx="4" fill="#d97757"/>
  <text x="523" y="166" text-anchor="middle" font-family="monospace" font-size="10" fill="#faf9f5" font-weight="700">D</text>

  <text x="495" y="202" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#5a5955">回到普通终端</text>
  <text x="495" y="218" text-anchor="middle" font-family="monospace" font-size="9" fill="#788c5d" font-weight="600">任务继续在后台运行 ✓</text>

  <!-- Arrow 3→4 -->
  <line x1="580" y1="157" x2="598" y2="157" stroke="#d97757" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ====== Step 4: Reattach ====== -->
  <rect x="600" y="82" width="170" height="150" rx="10" fill="#faf9f5" stroke="#d97757" stroke-width="2" filter="url(#sh)"/>
  <rect x="600" y="82" width="170" height="40" rx="10" fill="#d97757"/>
  <rect x="600" y="102" width="170" height="20" fill="#d97757"/>
  <text x="685" y="107" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">重连</text>
  <circle cx="616" cy="102" r="10" fill="#faf9f5" opacity="0.3"/>
  <text x="616" y="107" text-anchor="middle" font-family="monospace" font-size="10" fill="#faf9f5" font-weight="700">4</text>

  <rect x="614" y="130" width="142" height="50" rx="4" fill="#141413"/>
  <text x="622" y="146" font-family="monospace" font-size="9" fill="#6a9bcc">$</text>
  <text x="632" y="146" font-family="monospace" font-size="9" fill="#faf9f5">tmux attach -t train</text>
  <text x="622" y="162" font-family="monospace" font-size="9" fill="#788c5d">Reattached! 一切都还在</text>
  <line x1="622" y1="170" x2="682" y2="170" stroke="#b0aea5" stroke-width="0.5"/>

  <text x="685" y="202" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="10" fill="#5a5955">随时回来查看进度</text>
  <text x="685" y="218" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757" font-weight="600">attach -t &lt;name&gt;</text>

  <!-- ====== Bottom callout ====== -->
  <rect x="80" y="265" width="640" height="55" rx="10" fill="#141413" opacity="0.04"/>
  <rect x="80" y="265" width="640" height="3" rx="1.5" fill="#d97757"/>
  <text x="400" y="288" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="13" fill="#141413">
    关掉终端
    <tspan fill="#d97757" font-weight="700">≠</tspan>
    结束任务 — 这就是
    <tspan fill="#d97757" font-weight="700">tmux 的核心价值</tspan>
  </text>
  <text x="400" y="306" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="11" fill="#b0aea5">断网、关机、SSH 断开都不影响 —— 任务一直在服务器上跑</text>

  <!-- Timeline dots at bottom -->
  <circle cx="115" cy="345" r="4" fill="#d97757" opacity="0.4"/>
  <circle cx="305" cy="345" r="4" fill="#d97757" opacity="0.6"/>
  <circle cx="495" cy="345" r="4" fill="#d97757" opacity="0.4"/>
  <circle cx="685" cy="345" r="4" fill="#d97757" opacity="0.8"/>
  <line x1="119" y1="345" x2="301" y2="345" stroke="#e8e6dc" stroke-width="1"/>
  <line x1="309" y1="345" x2="491" y2="345" stroke="#e8e6dc" stroke-width="1"/>
  <line x1="499" y1="345" x2="681" y2="345" stroke="#e8e6dc" stroke-width="1"/>

  <text x="115" y="365" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">创建</text>
  <text x="305" y="365" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">运行</text>
  <text x="495" y="365" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">断开</text>
  <text x="685" y="365" text-anchor="middle" font-family="monospace" font-size="8" fill="#b0aea5">重连</text>

  <!-- Horizontal timeline line -->
  <line x1="40" y1="390" x2="760" y2="390" stroke="#e8e6dc" stroke-width="1"/>
</svg>
