<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="400" rx="12" fill="#faf9f5"/>

  <text x="400" y="34" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="700" fill="#141413">常用命令速查</text>
  <text x="400" y="54" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="12" fill="#b0aea5">会话管理 + 窗格操作快捷键</text>

  <!-- ====== Left Column: Session Management ====== -->
  <rect x="25" y="72" width="365" height="38" rx="8" fill="#141413"/>
  <text x="207" y="96" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">会话管理</text>

  <!-- new -->
  <rect x="25" y="116" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="25" y="116" width="4" height="34" rx="2" fill="#6a9bcc"/>
  <text x="42" y="134" font-family="monospace" font-size="11" fill="#141413">新建会话</text>
  <text x="110" y="134" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <text x="124" y="134" font-family="monospace" font-size="10" fill="#141413" font-weight="600">tmux new -s 名字</text>

  <!-- list -->
  <rect x="25" y="154" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="25" y="154" width="4" height="34" rx="2" fill="#6a9bcc"/>
  <text x="42" y="172" font-family="monospace" font-size="11" fill="#141413">查看所有</text>
  <text x="110" y="172" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <text x="124" y="172" font-family="monospace" font-size="10" fill="#141413" font-weight="600">tmux ls</text>

  <!-- attach -->
  <rect x="25" y="192" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="25" y="192" width="4" height="34" rx="2" fill="#788c5d"/>
  <text x="42" y="210" font-family="monospace" font-size="11" fill="#141413">重新连接</text>
  <text x="110" y="210" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <text x="124" y="210" font-family="monospace" font-size="10" fill="#141413" font-weight="600">tmux attach -t 名字</text>

  <!-- detach -->
  <rect x="25" y="230" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="25" y="230" width="4" height="34" rx="2" fill="#d97757"/>
  <text x="42" y="248" font-family="monospace" font-size="11" fill="#141413">断开会话</text>
  <text x="110" y="248" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <!-- keycaps -->
  <rect x="124" y="237" width="28" height="18" rx="3" fill="#141413"/>
  <text x="138" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#faf9f5" font-weight="600">Ctrl</text>
  <text x="157" y="250" font-family="monospace" font-size="11" fill="#b0aea5">+</text>
  <rect x="168" y="237" width="16" height="18" rx="3" fill="#141413"/>
  <text x="176" y="250" text-anchor="middle" font-family="monospace" font-size="9" fill="#faf9f5" font-weight="600">B</text>
  <text x="189" y="250" font-family="monospace" font-size="11" fill="#b0aea5">,</text>
  <rect x="200" y="237" width="16" height="18" rx="3" fill="#d97757"/>
  <text x="208" y="250" text-anchor="middle" font-family="monospace" font-size="9" fill="#faf9f5" font-weight="700">D</text>

  <!-- kill -->
  <rect x="25" y="268" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="25" y="268" width="4" height="34" rx="2" fill="#b0aea5"/>
  <text x="42" y="286" font-family="monospace" font-size="11" fill="#141413">杀死会话</text>
  <text x="110" y="286" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <text x="124" y="286" font-family="monospace" font-size="10" fill="#141413" font-weight="600">tmux kill-session -t 名字</text>

  <!-- rename -->
  <rect x="25" y="306" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="25" y="306" width="4" height="34" rx="2" fill="#b0aea5"/>
  <text x="42" y="324" font-family="monospace" font-size="11" fill="#141413">重命名</text>
  <text x="110" y="324" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <text x="124" y="324" font-family="monospace" font-size="10" fill="#141413" font-weight="600">tmux rename-session -t 旧名 新名</text>

  <!-- ====== Right Column: Pane Operations ====== -->
  <rect x="410" y="72" width="365" height="38" rx="8" fill="#141413"/>
  <text x="592" y="96" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="14" font-weight="700" fill="#faf9f5">窗格操作</text>

  <!-- Ctrl+B " -->
  <rect x="410" y="116" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="410" y="116" width="4" height="34" rx="2" fill="#6a9bcc"/>
  <text x="427" y="134" font-family="monospace" font-size="11" fill="#141413">左右分屏</text>
  <text x="510" y="134" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <rect x="524" y="122" width="28" height="18" rx="3" fill="#141413"/>
  <text x="538" y="135" text-anchor="middle" font-family="monospace" font-size="8" fill="#faf9f5" font-weight="600">Ctrl</text>
  <text x="557" y="134" font-family="monospace" font-size="11" fill="#b0aea5">+</text>
  <rect x="568" y="122" width="16" height="18" rx="3" fill="#141413"/>
  <text x="576" y="135" text-anchor="middle" font-family="monospace" font-size="9" fill="#faf9f5" font-weight="600">B</text>
  <text x="589" y="134" font-family="monospace" font-size="11" fill="#b0aea5">,</text>
  <rect x="600" y="122" width="20" height="18" rx="3" fill="#6a9bcc"/>
  <text x="610" y="135" text-anchor="middle" font-family="monospace" font-size="10" fill="#faf9f5" font-weight="700">%</text>
  <text x="628" y="134" font-family="monospace" font-size="9" fill="#b0aea5">竖向分割</text>

  <!-- Ctrl+B % -->
  <rect x="410" y="154" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="410" y="154" width="4" height="34" rx="2" fill="#6a9bcc"/>
  <text x="427" y="172" font-family="monospace" font-size="11" fill="#141413">上下分屏</text>
  <text x="510" y="172" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <rect x="524" y="160" width="28" height="18" rx="3" fill="#141413"/>
  <text x="538" y="173" text-anchor="middle" font-family="monospace" font-size="8" fill="#faf9f5" font-weight="600">Ctrl</text>
  <text x="557" y="172" font-family="monospace" font-size="11" fill="#b0aea5">+</text>
  <rect x="568" y="160" width="16" height="18" rx="3" fill="#141413"/>
  <text x="576" y="173" text-anchor="middle" font-family="monospace" font-size="9" fill="#faf9f5" font-weight="600">B</text>
  <text x="589" y="172" font-family="monospace" font-size="11" fill="#b0aea5">,</text>
  <rect x="600" y="160" width="20" height="18" rx="3" fill="#6a9bcc"/>
  <text x="610" y="173" text-anchor="middle" font-family="monospace" font-size="10" fill="#faf9f5" font-weight="700">"</text>
  <text x="628" y="172" font-family="monospace" font-size="9" fill="#b0aea5">横向分割</text>

  <!-- Ctrl+B arrows -->
  <rect x="410" y="192" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="410" y="192" width="4" height="34" rx="2" fill="#788c5d"/>
  <text x="427" y="210" font-family="monospace" font-size="11" fill="#141413">切换窗格</text>
  <text x="510" y="210" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <rect x="524" y="198" width="28" height="18" rx="3" fill="#141413"/>
  <text x="538" y="211" text-anchor="middle" font-family="monospace" font-size="8" fill="#faf9f5" font-weight="600">Ctrl</text>
  <text x="557" y="210" font-family="monospace" font-size="11" fill="#b0aea5">+</text>
  <rect x="568" y="198" width="16" height="18" rx="3" fill="#141413"/>
  <text x="576" y="211" text-anchor="middle" font-family="monospace" font-size="9" fill="#faf9f5" font-weight="600">B</text>
  <text x="589" y="210" font-family="monospace" font-size="11" fill="#b0aea5">,</text>
  <rect x="600" y="198" width="16" height="18" rx="3" fill="#788c5d"/>
  <text x="608" y="211" text-anchor="middle" font-family="monospace" font-size="10" fill="#faf9f5" font-weight="700">◄</text>
  <text x="622" y="210" font-family="monospace" font-size="10" fill="#788c5d" font-weight="600">►▼▲</text>
  <text x="660" y="210" font-family="monospace" font-size="9" fill="#b0aea5">方向切换</text>

  <!-- Ctrl+B [ -->
  <rect x="410" y="230" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="410" y="230" width="4" height="34" rx="2" fill="#d97757"/>
  <text x="427" y="248" font-family="monospace" font-size="11" fill="#141413">滚动模式</text>
  <text x="510" y="248" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <rect x="524" y="236" width="28" height="18" rx="3" fill="#141413"/>
  <text x="538" y="249" text-anchor="middle" font-family="monospace" font-size="8" fill="#faf9f5" font-weight="600">Ctrl</text>
  <text x="557" y="248" font-family="monospace" font-size="11" fill="#b0aea5">+</text>
  <rect x="568" y="236" width="16" height="18" rx="3" fill="#141413"/>
  <text x="576" y="249" text-anchor="middle" font-family="monospace" font-size="9" fill="#faf9f5" font-weight="600">B</text>
  <text x="589" y="248" font-family="monospace" font-size="11" fill="#b0aea5">,</text>
  <rect x="600" y="236" width="16" height="18" rx="3" fill="#d97757"/>
  <text x="608" y="249" text-anchor="middle" font-family="monospace" font-size="10" fill="#faf9f5" font-weight="700">[</text>
  <text x="624" y="248" font-family="monospace" font-size="9" fill="#b0aea5">↑↓/PgUp 翻历史</text>

  <!-- Ctrl+B / search -->
  <rect x="410" y="268" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="410" y="268" width="4" height="34" rx="2" fill="#d97757"/>
  <text x="427" y="286" font-family="monospace" font-size="11" fill="#141413">搜索文本</text>
  <text x="510" y="286" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <rect x="524" y="274" width="28" height="18" rx="3" fill="#141413"/>
  <text x="538" y="287" text-anchor="middle" font-family="monospace" font-size="8" fill="#faf9f5" font-weight="600">Ctrl</text>
  <text x="557" y="286" font-family="monospace" font-size="11" fill="#b0aea5">+</text>
  <rect x="568" y="274" width="16" height="18" rx="3" fill="#141413"/>
  <text x="576" y="287" text-anchor="middle" font-family="monospace" font-size="9" fill="#faf9f5" font-weight="600">B</text>
  <text x="589" y="286" font-family="monospace" font-size="11" fill="#b0aea5">,</text>
  <rect x="600" y="274" width="16" height="18" rx="3" fill="#d97757"/>
  <text x="608" y="287" text-anchor="middle" font-family="monospace" font-size="10" fill="#faf9f5" font-weight="700">/</text>
  <text x="624" y="286" font-family="monospace" font-size="9" fill="#b0aea5">在历史中搜索</text>

  <!-- Exit scroll -->
  <rect x="410" y="306" width="365" height="34" rx="6" fill="#faf9f5" stroke="#e8e6dc" stroke-width="1"/>
  <rect x="410" y="306" width="4" height="34" rx="2" fill="#b0aea5"/>
  <text x="427" y="324" font-family="monospace" font-size="11" fill="#141413">退出滚动</text>
  <text x="510" y="324" font-family="monospace" font-size="10" fill="#b0aea5">—</text>
  <rect x="524" y="312" width="20" height="18" rx="3" fill="#141413"/>
  <text x="534" y="325" text-anchor="middle" font-family="monospace" font-size="10" fill="#faf9f5" font-weight="700">q</text>

  <!-- ====== Bottom: Config recommendation ====== -->
  <rect x="25" y="354" width="750" height="38" rx="8" fill="#e8e6dc"/>
  <text x="207" y="377" font-family="Lora,Georgia,serif" font-size="12" fill="#141413">配置文件</text>
  <text x="300" y="377" font-family="monospace" font-size="11" fill="#d97757" font-weight="600">~/.tmux.conf</text>
  <text x="447" y="377" font-family="Lora,Georgia,serif" font-size="12" fill="#141413">推荐设置：</text>
  <text x="530" y="377" font-family="monospace" font-size="11" fill="#5a5955">mouse on</text>
  <text x="615" y="377" font-family="monospace" font-size="11" fill="#5a5955">· mode-keys vi</text>
  <text x="715" y="377" font-family="monospace" font-size="11" fill="#5a5955">· history 10000</text>
</svg>
