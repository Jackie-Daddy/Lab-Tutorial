# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Lab Tutorial
subtitle: 一些小技巧 · Lab Tips
description: 在共享/远程实验室服务器上干活时攒下的小技巧，每篇都是独立、可直接上手的短教程。
keywords: lab, server, tmux, proxy, vscode, cursor, debug, tutorial
author: Lab Team
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here.
url: https://j4ck1e2000.github.io/Lab-Tutorial
root: /Lab-Tutorial/
permalink: :title/
permalink_defaults:
  lang: zh
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: lab-theme

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/J4ck1e2000/Lab-Tutorial.git
  branch: gh-pages
